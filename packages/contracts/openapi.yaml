openapi: 3.0.3

info:
  title: InterviewIQ Contract
  version: 0.4.0
  description: >
    Source-of-truth contract for the InterviewIQ service boundaries.

    Two boundaries live here:

    * **candidate** (`interviewiq-web` ↔ `interviewiq-api`, served at :8080) — the
      candidate-facing REST surface, JWT-authenticated. The frontend generates its
      TypeScript types from this file (`scripts/generate-types.ts` → openapi-typescript).
    * **internal** (`interviewiq-api` ↔ `interviewiq-ai-service`, served at :8000) —
      the service-to-service surface guarded by the `X-Internal-Api-Key` shared secret.

    Interview Prep (Pipeline 1) is the surface added in 0.2.0: a candidate books an
    interview session for a JD + round + slot; a scheduled job on the backend, a
    configurable lead time before the slot, asks the ai-service to build an
    `InterviewPlan` from the brief + profile + JD + question bank. This is prep ONLY —
    no live voice loop, no post-interview scoring/debrief. The interview rubric lives
    ONLY on `InterviewPlan`; it is never grafted onto the descriptive Profile Builder
    `ProfileSummary` contract.

    Email/password auth (register, login, email verification, password reset) and the
    `CurrentUser` shape are the surface added in 0.3.0.

    Company research (admin): curated companies, research runs with pause/resume/stop and a
    full-verbosity trace (spans + events) is the surface added in 0.4.0. Research payloads are the
    ai-service's snake_case JSON passed through by interviewiq-api; admin company payloads are camelCase.

servers:
  - url: http://localhost:8080
    description: interviewiq-api (candidate-facing, JWT)

tags:
  - name: auth
    description: >
      Backend-owned auth (api ↔ web). Google sign-in, email/password accounts, email
      verification, password reset, refresh-token rotation. Session = short-lived JWT access
      token (JSON body) + an httpOnly `refresh_token` cookie scoped to `/api/v1/auth`.
  - name: users
    description: The signed-in user.
  - name: interview-sessions
    description: Candidate-facing interview booking + prep status (api ↔ web).
  - name: internal-interview-prep
    description: Service-to-service interview-plan generation (api ↔ ai-service).
  - name: admin-companies
    description: Curated company catalogue the research job works through (ADMIN only).
  - name: admin-research
    description: Company research runs, controls and their full trace (ADMIN only; snake_case passthrough).
  - name: internal-research
    description: Service-to-service research targets (ai-service → api).

paths:
  # ------------------------------------------------------------------ #
  # Auth (interviewiq-web ↔ interviewiq-api)                            #
  # ------------------------------------------------------------------ #
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an email/password account and sign in.
      description: >
        Public. The email is trimmed and lowercased; the name is trimmed. The new account is
        role USER (ADMIN for bootstrap admin emails), `onboardingComplete=false` and unverified;
        a verification link (`{FRONTEND_URL}/verify-email?token=…`) is emailed immediately.
        Signs the user in: returns the access token and sets the `refresh_token` cookie.
        Rate limited per client IP (10/hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: >
            The email is already registered. `email_taken` — an email/password account exists
            (log in instead). `use_google` — the email belongs to a Google account ("This email
            signs in with Google. Continue with Google instead.").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                email_taken:
                  value: { code: email_taken, message: An account with this email already exists. Log in instead. }
                use_google:
                  value: { code: use_google, message: This email signs in with Google. Continue with Google instead. }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email + password.
      description: >
        Public. The email is matched case-insensitively. An unverified email may still sign in.
        Wrong email, wrong password, and an account with no password (Google-only) all return
        the same 401 `invalid_credentials`. Rate limited per IP + email (10/15 min) and per IP
        (50/15 min).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — Incorrect email or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example: { code: invalid_credentials, message: Incorrect email or password. }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm the email address with the token from the verification link.
      description: Public. Tokens are single-use and expire after 24 hours; only the newest link sent works.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: "#/components/responses/InvalidTokenOrRequest"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Email a fresh verification link to the signed-in user.
      description: >
        Requires the Bearer access token. A 204 no-op when the email is already verified.
        Supersedes any earlier verification link. Rate limited per user (5/hour).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Link sent (or nothing to do).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a password-reset link.
      description: >
        Public. Always 204, whether or not an account exists (no account enumeration). If one
        does — password or Google-only (resetting then adds a password) — a link to
        `{FRONTEND_URL}/reset-password?token=…` is emailed; it expires after 1 hour and only the
        newest one works. Rate limited per IP + email (5/hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token from the reset link.
      description: >
        Public. Sets the new password, marks the email verified, consumes the token and signs the
        user out everywhere (every refresh token is revoked). Does NOT sign in — follow with
        `login`. A password that fails validation (400 `invalid_request`) does not use up the
        token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/InvalidTokenOrRequest"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the refresh cookie and get a new access token.
      description: >
        Public; reads the `refresh_token` cookie. Every call rotates the cookie (the presented
        token stops working). A missing, expired, revoked or reused token is a bare 401 (no body)
        and clears the cookie.
      security: []
      responses:
        "200":
          description: New access token; the rotated refresh cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: No valid refresh token (empty body; the cookie is cleared).

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the refresh cookie's token and clear it.
      security: []
      responses:
        "204":
          description: Signed out.

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The signed-in user (role + onboarding + verification flags gate the UI).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's user no longer exists (empty body).

  # ------------------------------------------------------------------ #
  # Candidate-facing (interviewiq-web ↔ interviewiq-api, JWT)           #
  # ------------------------------------------------------------------ #
  /api/v1/interviews/sessions:
    get:
      operationId: listMyInterviewSessions
      tags: [interview-sessions]
      summary: List the authenticated candidate's interview sessions (newest first).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The candidate's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInterviewSession
      tags: [interview-sessions]
      summary: Book an interview session for a JD + round + slot (status SCHEDULED).
      description: >
        Creates a session for the selected job description, round type, and slot. The
        JD must resolve to a real, enabled company/role/level (CompanyRoleConfig) and
        the round type must be a valid `RoundType`. Prep is scheduled automatically —
        the session starts as `SCHEDULED` and the backend generates the plan shortly
        before the slot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewSessionRequest"
      responses:
        "201":
          description: The created session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/interviews/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getInterviewSession
      tags: [interview-sessions]
      summary: Get one interview session's status. Only the owning candidate may read it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interviews/sessions/{sessionId}/regenerate:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: regenerateInterviewSessionPrep
      tags: [interview-sessions]
      summary: Re-queue prep generation for a session (retry after PREP_FAILED, or refresh).
      description: >
        Idempotent by design — the ai-service caches on the fused input hash, so a
        regenerate with unchanged inputs returns the existing plan with no LLM calls.
        Moves the session back to `PREP_QUEUED`; the backend then (re)generates. Only
        the owning candidate may call this.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Regeneration accepted; session moved to PREP_QUEUED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interviews/sessions/{sessionId}/live:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: goLiveInterviewSession
      tags: [interview-sessions]
      summary: Start (or resume) the live interview; mints a LiveKit join token.
      description: >
        Moves a PREP_READY session to LIVE_IN_PROGRESS and mints a fresh LiveKit join
        token. Idempotent while already LIVE_IN_PROGRESS — returns a fresh token for
        the same room without altering session state. Only the owning candidate may
        call this.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The live session state, with a LiveKit join token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: getLiveInterviewSession
      tags: [interview-sessions]
      summary: Current live state (fresh token if LIVE_IN_PROGRESS).
      description: >
        Read-only check of the session's live state. Returns a fresh LiveKit token
        when LIVE_IN_PROGRESS; livekitUrl/token/roomName are null for any other
        status. Only the owning candidate may call this.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The live session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jds/{jdId}:
    get:
      tags: [catalogue]
      operationId: getJobDescription
      summary: Read a published JD with its current candidate-visible interview process.
      parameters:
        - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: JD and verified manual process when available., content: { application/json: { schema: { $ref: "#/components/schemas/JobDescriptionDetail" } } } }
        "404": { description: JD is unavailable. }
  /api/v1/interviews/sessions/{sessionId}/reschedule:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: rescheduleInterviewSession
      tags: [interview-sessions]
      summary: Move a not-yet-started interview to another slot (409 session_slot_taken if you already have one then).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RescheduleInterviewSessionRequest" } } }
      responses:
        "200": { description: Rescheduled., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewSession" } } } }
        "409": { description: Slot taken or session can no longer be moved. }
  /api/v1/interviews/sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: cancelInterviewSession
      tags: [interview-sessions]
      summary: Cancel a not-yet-started interview.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewSession" } } } }
        "409": { description: Session can no longer be cancelled. }
  /api/v1/loops:
    get:
      operationId: listLoops
      tags: [loops]
      summary: The candidate's loops with per-round state and progress.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Loops., content: { application/json: { schema: { $ref: "#/components/schemas/LoopList" } } } }
    post:
      operationId: confirmLoop
      tags: [loops]
      summary: Confirm a process for a JD (official, or one of your saved processes → a standalone loop).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmLoopRequest" } } }
      responses:
        "201": { description: Loop created., content: { application/json: { schema: { $ref: "#/components/schemas/Loop" } } } }
        "409": { description: A live loop already exists for this JD, or the role has no process. }
  /api/v1/loops/{loopId}:
    parameters:
      - { name: loopId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLoop
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The loop., content: { application/json: { schema: { $ref: "#/components/schemas/Loop" } } } }
        "404": { description: Not found. }
    patch:
      operationId: setLoopStatus
      tags: [loops]
      summary: Pause, resume or abandon a loop (abandoning cancels its upcoming interviews).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetLoopStatusRequest" } } }
      responses:
        "200": { description: Updated loop., content: { application/json: { schema: { $ref: "#/components/schemas/Loop" } } } }
  /api/v1/processes:
    get:
      operationId: listProcesses
      tags: [loops]
      summary: The candidate's saved custom processes.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Processes., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewProcessList" } } } }
    post:
      operationId: createProcess
      tags: [loops]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SaveProcessRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewProcess" } } } }
  /api/v1/processes/official/{jdId}:
    get:
      operationId: getOfficialProcess
      tags: [loops]
      summary: A JD's suggested process as a read-only graph.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Graph., content: { application/json: { schema: { $ref: "#/components/schemas/OfficialProcess" } } } }
  /api/v1/processes/{processId}:
    parameters:
      - { name: processId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProcess
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The process., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewProcess" } } } }
    put:
      operationId: updateProcess
      tags: [loops]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SaveProcessRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewProcess" } } } }
    delete:
      operationId: deleteProcess
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
  /api/v1/processes/{processId}/duplicate:
    parameters:
      - { name: processId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: duplicateProcess
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The copy., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewProcess" } } } }
  /api/v1/targets:
    get:
      operationId: listTargets
      tags: [loops]
      summary: JDs the candidate is watching.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Targets., content: { application/json: { schema: { $ref: "#/components/schemas/TargetList" } } } }
  /api/v1/targets/status/{jdId}:
    get:
      operationId: getJdLoopStatus
      tags: [loops]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Status., content: { application/json: { schema: { $ref: "#/components/schemas/JdLoopStatus" } } } }
  /api/v1/targets/{jdId}:
    parameters:
      - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: addTarget
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Added. }
    delete:
      operationId: removeTarget
      tags: [loops]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed. }
  /api/v1/admin/companies:
    get:
      operationId: listAdminCompanies
      tags: [admin-companies]
      summary: Every company with its research state (research is null when the AI service is unreachable).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Companies., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompanyList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCompany
      tags: [admin-companies]
      summary: Add a company to research. It starts unpublished (students see it after an admin approves its first draft).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCompanyRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: "`invalid_company` | `invalid_website` | `invalid_aliases`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`company_exists` — the slug is taken.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/seed:
    post:
      operationId: seedCompanies
      tags: [admin-companies]
      summary: Load the starter catalogue (upsert-only; never deletes).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Seed result., content: { application/json: { schema: { $ref: "#/components/schemas/SeedResult" } } } }
  /api/v1/admin/companies/{companyId}:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCompany
      tags: [admin-companies]
      summary: Edit identity fields or archive. The slug never changes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCompanyRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: "`invalid_company` | `invalid_website` | `invalid_aliases` | `invalid_status`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCompany
      tags: [admin-companies]
      summary: Delete the company with its JDs and role configs.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/companies/{companyId}/enrichment:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin]
      operationId: getCompanyEnrichment
      summary: Read the enrichment draft, prefilling available research on first open (ADMIN only).
      responses:
        "200": { description: Current draft and publication metadata., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
    put:
      tags: [Admin]
      operationId: saveCompanyEnrichment
      summary: Save an incomplete draft using optimistic revision (ADMIN only).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentWriteRequest" } } }
      responses:
        "200": { description: Saved draft., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "409": { description: Stale revision; reload before saving. }
  /api/v1/admin/companies/{companyId}/enrichment/prefill:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: prefillCompanyEnrichment
      summary: Fill blank unverified fields from available research without replacing saved values (ADMIN only).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentPrefillRequest" } } }
      responses:
        "200": { description: Current draft; revision advances only when values change., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "409": { description: Stale revision. }
        "502": { description: Research service unavailable; draft unchanged. }
  /api/v1/admin/companies/{companyId}/enrichment/publish:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: publishCompanyEnrichment
      summary: Atomically publish verified company, roles and linear round sequences (ADMIN only).
      description: Archived companies must first be restored. Existing JD role, level and specialization are immutable; add a new role to change identity.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentWriteRequest" } } }
      responses:
        "200": { description: Immediately published., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "400": { description: Invalid or unverified content. }
        "409": { description: Stale revision, archived company or changed JD identity; no changes published. }
  /api/v1/admin/companies/{companyId}/draft:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCompanyDraft
      tags: [admin-companies]
      summary: The newest research draft (any status) with the company, for the review view.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Draft., content: { application/json: { schema: { $ref: "#/components/schemas/CompanyDraftResponse" } } } }
        "404": { description: "`company_not_found` | `draft_not_found` (no research has produced a draft yet).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/{companyId}/draft/{draftId}/approve:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveCompanyDraft
      tags: [admin-companies]
      summary: Approve a pending draft and publish its identity, profile and compensation onto the company.
      description: Roles remain in the approved research snapshot; this does not publish JDs, booking configurations or interview briefs. Missing or unavailable profile and compensation values preserve existing published facts.
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DraftDecisionRequest" } } }
      responses:
        "200": { description: The published company., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: Invalid draft values; the company is not changed., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`draft_stale` | `draft_not_pending` | `draft_not_approvable` (research says it is not a company).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/{companyId}/draft/{draftId}/reject:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string } }
    post:
      operationId: rejectCompanyDraft
      tags: [admin-companies]
      summary: Reject a pending draft. The company stays as it was.
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DraftDecisionRequest" } } }
      responses:
        "204": { description: Rejected. }
        "409": { description: "`draft_stale` | `draft_not_pending`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs:
    get:
      operationId: listResearchRuns
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Newest first., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunList" } } } }
        "502": { description: "`ai_service_unreachable`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: startResearchRun
      tags: [admin-research]
      summary: Start a run. Only one run may be active (queued, running, pausing, paused or stopping).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartResearchRunRequest" } } }
      responses:
        "201": { description: The new run., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "400": { description: "`no_companies` | `invalid_mode`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`run_active`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: "`targets_unavailable` | `research_disabled`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: getResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Run with its items., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/research/runs/{runId}/pause:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: pauseResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pausing., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/resume:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: resumeResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Resumed., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/stop:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: stopResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Stopping or stopped., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/budget:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    patch:
      operationId: updateResearchBudget
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResearchBudgetUpdate" } } }
      responses:
        "200": { description: Updated run., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "400": { description: "`invalid_budget` — negative, or below calls already made.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/events:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: listResearchEvents
      tags: [admin-research]
      summary: Trace events, ascending by seq. With beforeSeq, the newest `limit` events before it (still ascending).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: afterSeq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: beforeSeq, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/ResearchLevel" } }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: node, in: query, schema: { type: string } }
        - { name: type, in: query, description: Event type prefix, e.g. `span.`, schema: { type: string } }
        - { name: spanId, in: query, schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the message., schema: { type: string } }
      responses:
        "200": { description: A page of events., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchEventPage" } } } }
  /api/v1/admin/research/runs/{runId}/spans:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: listResearchSpans
      tags: [admin-research]
      summary: The run's span tree, flat (parent_id links), without inputs/outputs.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, schema: { type: string } }
      responses:
        "200": { description: Spans by start time., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchSpanList" } } } }
  /api/v1/admin/research/spans/{spanId}:
    parameters:
      - { name: spanId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
    get:
      operationId: getResearchSpan
      tags: [admin-research]
      summary: One span with its full input/output (offloaded payloads resolved) and its log events.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The span., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchSpanDetailResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/internal/research-targets:
    get:
      operationId: listResearchTargets
      tags: [internal-research]
      summary: Every active company (published or not) for the research run.
      security: [{ internalApiKey: [] }]
      responses:
        "200":
          description: Targets.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ResearchTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------------ #
  # Internal (interviewiq-api ↔ interviewiq-ai-service, X-Internal-Api-Key) #
  # ------------------------------------------------------------------ #
  /interview-plans:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    post:
      operationId: generateInterviewPlan
      tags: [internal-interview-prep]
      summary: Build (or return the cached) InterviewPlan for a session.
      description: >
        The backend assembles the session context + JD + candidate profile and posts
        it here. Stage 1 (no LLM) gathers the brief and the question bank and computes
        a deterministic input hash. If a stored plan for this session already has the
        same input hash, it is returned unchanged (no LLM calls). Otherwise three
        schema-validated LLM calls (persona, ladders, probes) run concurrently, the
        plan is assembled, persisted (one per session), and returned.
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInterviewPlanRequest"
      responses:
        "200":
          description: The generated or cached plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: No brief/questions available for this (company, role, level).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Plan generation failed (LLM never produced a valid plan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /interview-plans/start:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    post:
      operationId: startInterviewPlan
      tags: [internal-interview-prep]
      summary: Start plan generation in the background (fire-and-poll variant).
      description: >
        Same request body and cache/persist semantics as POST /interview-plans, but returns a
        run_id immediately and runs the pipeline in the background. The caller polls
        GET /interview-plans/runs/{runId} until the run is terminal. Used by the prep trigger so a
        slow, concurrent Stage-2 LLM run can't trip the HTTP client read timeout (which would
        wrongly mark the session PREP_FAILED). Single-process: start and poll must hit the same worker.
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInterviewPlanRequest"
      responses:
        "200":
          description: The run was started.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [running] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /interview-plans/runs/{runId}:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    get:
      operationId: getInterviewPlanRun
      tags: [internal-interview-prep]
      summary: Poll a run started by /interview-plans/start.
      description: >
        Returns the run's terminal state. While running, plan and error are null. On completed,
        plan carries the InterviewPlan. On failed, error carries {code, message} — code mirrors the
        synchronous route's failure modes (no_data ≈ 422, llm_error ≈ 502).
      security:
        - internalApiKey: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The run snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [running, completed, failed] }
                  plan:
                    allOf:
                      - $ref: "#/components/schemas/InterviewPlan"
                    nullable: true
                  error:
                    type: object
                    nullable: true
                    properties:
                      code: { type: string }
                      message: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchRunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  headers:
    RefreshTokenCookie:
      description: >
        `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=<Lax|Strict|None>`
        (+ `Secure` in production). Never readable by JavaScript.
      schema:
        type: string

  responses:
    InvalidRequest:
      description: "`invalid_request` — the body failed validation; `message` is human-readable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example: { code: invalid_request, message: Password must be at least 8 characters. }
    InvalidTokenOrRequest:
      description: >
        `invalid_token` — the link's token is unknown, expired or already used (ask for a new
        link). `invalid_request` — the body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            invalid_token:
              value: { code: invalid_token, message: This link is invalid or has expired. Request a new one. }
            invalid_request:
              value: { code: invalid_request, message: Password must be at least 8 characters. }
    RateLimited:
      description: "`rate_limited` — too many attempts; retry after `Retry-After` seconds."
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example: { code: rate_limited, message: Too many attempts. Please wait a few minutes and try again. }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found (or not owned by the caller).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      description: The stable { code, message } error envelope used across the api.
      required: [code, message]
      properties:
        code:
          type: string
          example: session_jd_not_found
        message:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; 1–100 characters after trimming.
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before use.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 8–128 characters and not only whitespace. Not trimmed.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; matched case-insensitively.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: >
            Only the length is checked here (so a later, stricter password policy never locks
            out existing accounts); a wrong password is 401 `invalid_credentials`.

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: "HS256 JWT; send as `Authorization: Bearer <accessToken>`."
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds (900 by default).
          example: 900

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The `token` query parameter of the verification link.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The `token` query parameter of the reset link.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: The new password — same rules as `RegisterRequest.password`.

    Role:
      type: string
      enum: [USER, ADMIN]

    CurrentUser:
      type: object
      required: [id, email, name, role, onboardingComplete, emailVerified, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        onboardingComplete:
          type: boolean
          description: True once the onboarding wizard is finished. Gates app entry vs /onboarding.
        emailVerified:
          type: boolean
          description: >
            The user proved control of `email` (verification link, reset link, or a Google
            sign-in where Google verified it).
        hasPassword:
          type: boolean
          description: The account can sign in with email + password (false = Google-only).

    RoundType:
      type: string
      description: >
        A live, human-conducted interview round InterviewIQ can mock. Online Assessment is
        intentionally excluded — it's an automated coding test, not a live round, so it isn't
        bookable/conductable here. (The ai-service brief pipeline still recognises OA when it
        describes companies' real hiring processes; that's a separate, internal vocabulary.)
      enum:
        - dsa
        - system-design
        - lld
        - behavioural
        - hiring-manager

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    SessionStatus:
      type: string
      description: >
        Interview session lifecycle. Prep (SCHEDULED → PREP_QUEUED → PREP_READY, with
        PREP_FAILED) is Pipeline 1. Live states (LIVE_IN_PROGRESS, COMPLETED,
        ABORTED_TECHNICAL) are Pipeline 2 — a PREP_READY session transitions to
        LIVE_IN_PROGRESS on go-live, then to COMPLETED or ABORTED_TECHNICAL.
      enum:
        - SCHEDULED
        - PREP_QUEUED
        - PREP_READY
        - PREP_FAILED
        - LIVE_IN_PROGRESS
        - COMPLETED
        - ABORTED_TECHNICAL
        - CANCELLED

    CreateInterviewSessionRequest:
      type: object
      required: [jobDescriptionId, scheduledAt, timezone]
      properties:
        jobDescriptionId:
          type: string
          format: uuid
        roundType:
          allOf:
            - $ref: "#/components/schemas/RoundType"
          description: >
            Optional and normally omitted — the candidate does not pick the round. The backend
            assigns it (currently the first round; per-candidate round progression later). Accepted
            if sent (e.g. by the admin bench).
        scheduledAt:
          type: string
          format: date-time
          description: The chosen slot, as an absolute instant (UTC ISO-8601).
        timezone:
          type: string
          description: IANA timezone the candidate booked in (e.g. Asia/Kolkata).
          example: Asia/Kolkata
        loopId:
          type: string
          format: uuid
          nullable: true
          description: Book a round of this confirmed loop. Sent together with nodeId; the loop fixes the JD and the node fixes the round.
        nodeId:
          type: string
          nullable: true
          description: The loop graph node (round) being booked. The round must be unlocked.

    InterviewSession:
      type: object
      description: >
        A booked interview session and its prep readiness. `planReady` (status ==
        PREP_READY) is the only signal surfaced to the candidate — plan CONTENTS are
        the interviewer's material and are never returned here.
      required:
        - id
        - candidateId
        - jobDescriptionId
        - company
        - role
        - level
        - specialization
        - roundType
        - scheduledAt
        - timezone
        - status
        - planReady
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobDescriptionId:
          type: string
          format: uuid
        company:
          type: string
          description: Company slug.
        companyName:
          type: string
          nullable: true
          description: Human-readable company name, when known.
        role:
          type: string
        level:
          type: string
        specialization:
          type: string
        roundType:
          $ref: "#/components/schemas/RoundType"
        scheduledAt:
          type: string
          format: date-time
        timezone:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        planReady:
          type: boolean
          description: True when status == PREP_READY (an InterviewPlan exists).
        planVersion:
          type: string
          nullable: true
          description: The plan_version recorded once prep succeeds.
        inputHash:
          type: string
          nullable: true
          description: The ai-service fused input hash of the generated plan.
        prepError:
          type: string
          nullable: true
          description: Stable error code when status == PREP_FAILED.
        loopId:
          type: string
          format: uuid
          nullable: true
          description: The loop this session is a round of; null for ad-hoc bookings.
        nodeId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RescheduleInterviewSessionRequest:
      type: object
      required: [scheduledAt, timezone]
      properties:
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string }

    ProcessRoundNode:
      type: object
      required: [id, kind, type, name, durationMinutes, difficulty, topics, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [round] }
        type: { $ref: "#/components/schemas/RoundType" }
        name: { type: string }
        durationMinutes: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        topics: { type: array, items: { type: string } }
        position: { $ref: "#/components/schemas/ProcessPosition" }
    ProcessInfoNode:
      type: object
      description: "A non-interview step (online test, take-home). Display only, never connected, scheduled, scored or counted."
      required: [id, kind, name, note, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [info] }
        name: { type: string }
        note: { type: string }
        position: { $ref: "#/components/schemas/ProcessPosition" }
    ProcessPosition:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }
    ProcessGraph:
      type: object
      description: >
        An interview process as a graph. Round nodes are ordered by edges (a round unlocks once every round
        feeding into it is completed). No cycles; round nodes form one connected graph.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ProcessRoundNode"
              - $ref: "#/components/schemas/ProcessInfoNode"
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties: { source: { type: string }, target: { type: string } }
    JdBrief:
      type: object
      required: [jdId, title, company, companyName, role, level, specialization, techStack]
      properties:
        jdId: { type: string, format: uuid }
        title: { type: string }
        company: { type: string }
        companyName: { type: string }
        role: { type: string }
        level: { type: string }
        specialization: { type: string, nullable: true }
        techStack: { type: array, items: { type: string } }
    InterviewProcess:
      type: object
      required: [id, name, jd, graph, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        jd: { allOf: [{ $ref: "#/components/schemas/JdBrief" }], nullable: true }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InterviewProcessList:
      type: object
      required: [processes]
      properties:
        processes: { type: array, items: { $ref: "#/components/schemas/InterviewProcess" } }
    SaveProcessRequest:
      type: object
      description: Create (jdId + name, optional graph; defaults to a copy of the official process) or update (name and/or graph).
      properties:
        jdId: { type: string, format: uuid }
        name: { type: string }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
    OfficialProcess:
      type: object
      required: [graph]
      properties:
        graph: { $ref: "#/components/schemas/ProcessGraph" }
    LoopNodeState:
      type: string
      enum: [locked, available, booked, completed]
    Loop:
      type: object
      description: A confirmed process for a JD. `graph` is a snapshot taken at confirm time.
      required: [id, jdId, jd, processId, kind, status, countsTowardReadiness, confirmedAt, graph, nodeStates, progress, sessions]
      properties:
        id: { type: string, format: uuid }
        jdId: { type: string, format: uuid }
        jd: { allOf: [{ $ref: "#/components/schemas/JdBrief" }], nullable: true }
        processId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [official, standalone] }
        status: { type: string, enum: [active, paused, abandoned, completed] }
        countsTowardReadiness: { type: boolean, description: "Only unedited, suggested processes count." }
        confirmedAt: { type: string, format: date-time }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
        nodeStates: { type: object, additionalProperties: { $ref: "#/components/schemas/LoopNodeState" } }
        progress:
          type: object
          required: [total, completed, nextNodeIds]
          properties:
            total: { type: integer }
            completed: { type: integer }
            nextNodeIds: { type: array, items: { type: string } }
        sessions:
          type: array
          items:
            type: object
            required: [id, nodeId, status, scheduledAt]
            properties:
              id: { type: string, format: uuid }
              nodeId: { type: string, nullable: true }
              status: { $ref: "#/components/schemas/SessionStatus" }
              scheduledAt: { type: string, format: date-time }
    LoopList:
      type: object
      required: [loops]
      properties:
        loops: { type: array, items: { $ref: "#/components/schemas/Loop" } }
    ConfirmLoopRequest:
      type: object
      required: [jdId]
      properties:
        jdId: { type: string, format: uuid }
        processId: { type: string, format: uuid, nullable: true, description: "Omit to confirm the official process." }
    SetLoopStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, abandoned] }
    TargetList:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            required: [jd, addedAt, hasLiveLoop]
            properties:
              jd: { $ref: "#/components/schemas/JdBrief" }
              addedAt: { type: string, format: date-time }
              hasLiveLoop: { type: boolean }
    JdLoopStatus:
      type: object
      required: [targeted, loopId]
      properties:
        targeted: { type: boolean }
        loopId: { type: string, format: uuid, nullable: true }

    InterviewSessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/InterviewSession"

    GoLiveResponse:
      type: object
      description: >
        Result of starting or checking the live interview. `livekitUrl`/`token`/`roomName`
        are populated while status == LIVE_IN_PROGRESS and null otherwise (e.g. before
        prep is ready, or after the session has COMPLETED/ABORTED_TECHNICAL).
      required: [status]
      properties:
        livekitUrl:
          type: string
          nullable: true
        token:
          type: string
          nullable: true
        roomName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SessionStatus"

    # ------- Internal request (api → ai-service) ------- #
    GenerateInterviewPlanRequest:
      type: object
      description: Everything the ai-service needs to build a plan. Assembled by the backend.
      required: [session, jobDescription, candidateProfile]
      properties:
        session:
          $ref: "#/components/schemas/PlanSessionContext"
        jobDescription:
          $ref: "#/components/schemas/PlanJobDescription"
        candidateProfile:
          $ref: "#/components/schemas/PlanCandidateProfile"
        companyBrief:
          type: [object, 'null']
          additionalProperties: true
          description: Optional backend-owned verified publication. When present, prep uses this instead of the AI research brief. Contains generated_at, published_revision and final_experience with ordered rounds (type, topics, problems, format, duration_minutes).

    PlanSessionContext:
      type: object
      required: [sessionId, candidateId, company, role, level, specialization, roundType]
      properties:
        sessionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        company:
          type: string
        role:
          type: string
        level:
          type: string
        specialization:
          type: string
        roundType:
          $ref: "#/components/schemas/RoundType"

    PlanJobDescription:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        techStack:
          type: string
          nullable: true
          description: Comma-separated tech stack (as stored on the JD).

    PlanCandidateProfile:
      type: object
      description: >
        The candidate's descriptive profile, as the backend assembles it from
        CandidateProfile. Evidence-carrying, never scored. The ai-service hashes this
        to detect changes.
      properties:
        fullName:
          type: string
          nullable: true
        headline:
          type: string
          nullable: true
        targetRole:
          type: string
          nullable: true
        education:
          type: array
          items:
            $ref: "#/components/schemas/PlanEducation"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/PlanExperience"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/PlanProject"
        skills:
          type: array
          items:
            type: string
        achievements:
          type: array
          items:
            type: string
        links:
          $ref: "#/components/schemas/PlanLinks"
        codingProfile:
          allOf:
            - $ref: "#/components/schemas/PlanCodingProfile"
          nullable: true
          description: >
            Curated GitHub + LeetCode signals from the Profile Builder, or null if not connected.

    PlanCodingProfile:
      type: object
      description: >
        Compact, stable coding-platform signals the backend curates from the ProfileFragments —
        GitHub (languages, topRepos, contributionsLastYear) and LeetCode (solved, byTopic, contest).
        Free-form objects so the fragment shape can evolve without a contract change.
      properties:
        github:
          type: object
          additionalProperties: true
          nullable: true
        leetcode:
          type: object
          additionalProperties: true
          nullable: true

    PlanProject:
      type: object
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tech:
          type: array
          items: { type: string }
        bullets:
          type: array
          items: { type: string }
        link: { type: string, nullable: true }

    PlanEducation:
      type: object
      properties:
        institution: { type: string, nullable: true }
        degree: { type: string, nullable: true }
        field: { type: string, nullable: true }
        startYear: { type: string, nullable: true }
        endYear: { type: string, nullable: true }
        grade: { type: string, nullable: true }

    PlanExperience:
      type: object
      properties:
        company: { type: string, nullable: true }
        title: { type: string, nullable: true }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        location: { type: string, nullable: true }
        bullets:
          type: array
          items: { type: string }

    PlanLinks:
      type: object
      properties:
        github: { type: string, nullable: true }
        leetcode: { type: string, nullable: true }
        linkedin: { type: string, nullable: true }

    # ------- The plan itself (ai-service → api) ------- #
    InterviewPlan:
      type: object
      description: >
        The interviewer's prep material for one session. Descriptive and
        evidence-carrying throughout. The rubric on each question ladder lives ONLY
        here — never on any Profile Builder / ProfileSummary contract.
      required:
        - sessionId
        - candidateId
        - company
        - role
        - level
        - specialization
        - roundType
        - provenance
        - persona
        - roundArc
        - questionLadders
        - candidateProbes
        - redFlagWatchlist
      properties:
        sessionId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        company:
          type: string
        role:
          type: string
        level:
          type: string
        specialization:
          type: string
        roundType:
          $ref: "#/components/schemas/RoundType"
        provenance:
          $ref: "#/components/schemas/PlanProvenance"
        persona:
          $ref: "#/components/schemas/InterviewerPersona"
        roundArc:
          type: array
          description: Ordered, timed beats of the round.
          items:
            $ref: "#/components/schemas/RoundBeat"
        questionLadders:
          type: array
          items:
            $ref: "#/components/schemas/QuestionLadder"
        candidateProbes:
          type: array
          items:
            $ref: "#/components/schemas/CandidateProbe"
        redFlagWatchlist:
          type: array
          description: Behaviours/signals to watch for, carried from the brief.
          items:
            type: string

    PlanProvenance:
      type: object
      description: Versioning + traceability for one plan.
      required: [planVersion, inputHash, model, generatedAt]
      properties:
        planVersion:
          type: string
          description: Overall plan-shape version.
        personaPromptVersion:
          type: string
          nullable: true
        ladderPromptVersion:
          type: string
          nullable: true
        probesPromptVersion:
          type: string
          nullable: true
        briefGeneratedAt:
          type: string
          nullable: true
          description: Timestamp of the brief the plan was built from.
        profileHash:
          type: string
          nullable: true
        inputHash:
          type: string
          description: sha256 of the fused inputs — the cache key.
        model:
          type: string
          description: LLM model used (read from settings; never hardcoded).
        generatedAt:
          type: string
          format: date-time

    InterviewerPersona:
      type: object
      required: [name, seniority, disposition]
      properties:
        name:
          type: string
        seniority:
          type: string
          description: e.g. "Senior Software Engineer".
        disposition:
          type: string
          description: e.g. "warm but rigorous".
        styleNotes:
          type: string
          nullable: true
        opening:
          type: string
          nullable: true
          description: Opening script for the interviewer.
        closing:
          type: string
          nullable: true
          description: Closing script for the interviewer.
        groundedIn:
          type: array
          description: Evidence the persona is grounded in (brief/JD signals).
          items:
            type: string

    RoundBeat:
      type: object
      required: [phase, title, timeboxMins]
      properties:
        phase:
          type: string
          enum: [intro, warm-up, core, curveball, candidate-qs, wrap]
        title:
          type: string
        description:
          type: string
          nullable: true
        timeboxMins:
          type: integer

    QuestionLadder:
      type: object
      required: [basePrompt, followUps, hints, rubric]
      properties:
        questionSlug:
          type: string
          nullable: true
          description: Optional link to a QuestionRecord slug in the question bank.
        basePrompt:
          type: string
        difficulty:
          allOf:
            - $ref: "#/components/schemas/Difficulty"
          nullable: true
        followUps:
          type: array
          description: Escalating follow-ups, ordered easiest-to-hardest.
          items:
            type: string
        hints:
          type: array
          description: Increasingly explicit hints, ordered subtle-to-explicit.
          items:
            type: string
        rubric:
          type: array
          description: Weighted evaluation criteria (interviewer-only).
          items:
            $ref: "#/components/schemas/RubricCriterion"
        timeboxMins:
          type: integer
          nullable: true

    RubricCriterion:
      type: object
      required: [criterion, weight]
      properties:
        criterion:
          type: string
        weight:
          type: number
          description: Relative weight (0..1 or arbitrary scale; interviewer-only).
        strongDescriptor:
          type: string
          nullable: true
          description: What a strong answer looks like.
        weakDescriptor:
          type: string
          nullable: true
          description: What a weak answer looks like.

    CandidateProbe:
      type: object
      required: [prompt, whatItTests]
      properties:
        prompt:
          type: string
        groundedIn:
          type: string
          nullable: true
          description: The profile/JD signal this probe is grounded in.
        whatItTests:
          type: string
    CompanyResearchState:
      type: object
      required: [lastRunId, lastResearchedAt, lastStatus, latestDraftId, latestDraftStatus]
      properties:
        lastRunId: { type: string, nullable: true }
        lastResearchedAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, nullable: true, description: The company's item status in its latest run (ResearchItemStatus). }
        latestDraftId: { type: string, nullable: true }
        latestDraftStatus: { type: string, nullable: true, description: "pending_review | approved | rejected | superseded" }
        latestDraftCoverage:
          allOf: [{ $ref: "#/components/schemas/DraftCoverageSummary" }]
          nullable: true
          description: How many tracked research fields the latest draft fills; below total means partial research.
    JobDescriptionDetail:
      type: object
      required: [id, company, companyName, role, level, title, specialization, description, techStack, sourceUrl, yoeMin, yoeMax, ctcMinLpa, ctcMaxLpa, dataConfidence, dataAvailability, interviewProcess, sources]
      properties:
        id: { type: string, format: uuid }
        company: { type: string }
        companyName: { type: string }
        role: { type: string }
        level: { type: string }
        title: { type: string }
        specialization: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        techStack: { type: array, items: { type: string } }
        sourceUrl: { type: [string, 'null'] }
        yoeMin: { type: [number, 'null'] }
        yoeMax: { type: [number, 'null'] }
        ctcMinLpa: { type: [number, 'null'] }
        ctcMaxLpa: { type: [number, 'null'] }
        dataConfidence: { type: [string, 'null'] }
        dataAvailability: { type: string, enum: [rich, available, limited, none] }
        sources: { type: array, items: { type: string } }
        companyOverview:
          $ref: "#/components/schemas/EnrichmentCompany"
        interviewProcess:
          type: [object, 'null']
          additionalProperties: true
          description: Candidate-safe process. Verified manual rounds retain their explicit array order and source evidence.
          properties:
            rounds:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  round_number: { type: integer }
                  type: { type: string }
                  duration_minutes: { type: number }
                  difficulty: { type: string }
                  topics: { type: array, items: { type: string } }
                  problems: { type: array, items: { type: string } }
                  format: { type: string }
                  source_urls: { type: array, items: { type: string } }
    EnrichmentCompany:
      type: object
      additionalProperties: false
      required: [overview, culture, benefits, sourceUrls, verified]
      properties:
        overview: { type: string, maxLength: 10000 }
        culture: { type: string, maxLength: 10000 }
        benefits: { type: string, maxLength: 10000 }
        sourceUrls: { type: array, maxItems: 20, items: { type: string, format: uri, maxLength: 2048 } }
        verified: { type: boolean }
    EnrichmentRound:
      type: object
      additionalProperties: false
      required: [id, name, type, durationMinutes, difficulty, topics, questions, guidance, sourceUrls, verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        type: { type: string, enum: [dsa, system-design, lld, behavioural, hiring-manager] }
        durationMinutes: { type: integer, minimum: 1, maximum: 240 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        topics: { type: array, maxItems: 30, items: { type: string, maxLength: 255 } }
        questions: { type: array, maxItems: 30, items: { type: string, maxLength: 2000 } }
        guidance: { type: string, maxLength: 10000 }
        sourceUrls: { type: array, maxItems: 20, items: { type: string, format: uri, maxLength: 2048 } }
        verified: { type: boolean }
    EnrichmentRole:
      type: object
      additionalProperties: false
      required: [id, title, role, level, specialization, description, techStack, yoeMin, yoeMax, ctcMinLpa, ctcMaxLpa, sourceUrls, verified, rounds]
      properties:
        id: { type: string, format: uuid }
        jdId: { type: [string, 'null'], format: uuid }
        title: { type: string, maxLength: 255 }
        role: { type: string, maxLength: 255 }
        level: { type: string, maxLength: 16 }
        specialization: { type: [string, 'null'], maxLength: 32 }
        description: { type: string, maxLength: 20000 }
        techStack: { type: array, maxItems: 50, items: { type: string, maxLength: 255 } }
        yoeMin: { type: [number, 'null'], minimum: 0, maximum: 99.9 }
        yoeMax: { type: [number, 'null'], minimum: 0, maximum: 99.9 }
        ctcMinLpa: { type: [number, 'null'], minimum: 0, maximum: 9999.99 }
        ctcMaxLpa: { type: [number, 'null'], minimum: 0, maximum: 9999.99 }
        sourceUrls: { type: array, maxItems: 20, items: { type: string, format: uri, maxLength: 2048 } }
        verified: { type: boolean }
        rounds:
          type: array
          maxItems: 12
          description: Array order defines the connected linear interview sequence. Publication requires at least one verified round.
          items: { $ref: "#/components/schemas/EnrichmentRound" }
    EnrichmentDocument:
      type: object
      additionalProperties: false
      required: [company, roles]
      properties:
        company: { $ref: "#/components/schemas/EnrichmentCompany" }
        roles: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EnrichmentRole" } }
    EnrichmentPrefillRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0, maximum: 2147483646 }
    EnrichmentWriteRequest:
      type: object
      additionalProperties: false
      required: [revision, document]
      properties:
        revision: { type: integer, minimum: 0, maximum: 2147483646 }
        document: { $ref: "#/components/schemas/EnrichmentDocument" }
    EnrichmentResponse:
      type: object
      required: [revision, publishedRevision, publishedAt, verifiedBy, document]
      properties:
        revision: { type: integer }
        publishedRevision: { type: [integer, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
        verifiedBy: { type: [string, 'null'], format: uuid }
        document: { $ref: "#/components/schemas/EnrichmentDocument" }
    AdminCompany:
      type: object
      required: [id, name, slug, website, aliases, status, origin, tier, publishedVersion, publishedAt, createdAt, research]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        website: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }
        status: { type: string, enum: [active, archived] }
        origin: { type: string, enum: [seed, admin] }
        tier: { type: integer, nullable: true }
        publishedVersion: { type: integer, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        research:
          allOf: [{ $ref: "#/components/schemas/CompanyResearchState" }]
          nullable: true
    DraftField:
      type: object
      required: [value, confidence, provenance, source_urls, note]
      properties:
        value: { nullable: true, description: "Arbitrary JSON: a string, number, boolean, object, array or null (unavailable). Includes structured JD/interview-process objects and arrays of attributed review quotes." }
        confidence: { type: string, enum: [high, medium, low] }
        provenance: { type: string, description: "evidence | derived | inferred_from_similar | template | admin_override | unavailable" }
        source_urls: { type: array, items: { type: string } }
        note: { type: string, nullable: true }
        alternatives:
          type: array
          description: Values other sources reported, highest-weighted first. Empty when the sources agree; never silently dropped.
          items: { $ref: "#/components/schemas/DraftAlternative" }
        as_of: { type: string, nullable: true, description: "Date (YYYY-MM-DD) of the newest supporting source, when known." }
    DraftAlternative:
      type: object
      required: [value, source_urls, as_of]
      properties:
        value: { nullable: true, description: "Arbitrary JSON, same shape as the field's value." }
        source_urls: { type: array, items: { type: string } }
        as_of: { type: string, nullable: true }
    UnverifiedClaim:
      type: object
      description: Evidence the pipeline could not confirm (its geography or role is not established by the page). Shown to reviewers only; never published.
      required: [field, value, quote, url, reason]
      properties:
        field: { type: string }
        value: { nullable: true }
        quote: { type: string }
        url: { type: string }
        source_name: { type: string, nullable: true }
        date: { type: string, nullable: true }
        tier: { type: integer, nullable: true, description: "1 official · 2 established secondary · 3 community" }
        reason: { type: string, enum: [geo_unconfirmed, role_not_in_context, role_mismatch] }
        role_title: { type: string, nullable: true }
    DraftCoverageSummary:
      type: object
      required: [filled, total]
      properties:
        filled: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    DraftCoverage:
      allOf:
        - { $ref: "#/components/schemas/DraftCoverageSummary" }
        - type: object
          required: [missing]
          properties:
            missing: { type: array, items: { type: string }, description: "Tracked paths still unavailable, e.g. roles[<role_key>].jd. Reported pay (ctc_observations) and supported total CTC (ctc_min_lpa) are separate slots; reported pay alone does not fill total-CTC coverage." }
    DraftChange:
      type: object
      required: [path, change, before, after]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before: { nullable: true }
        after: { nullable: true }
    DraftConflict:
      type: object
      required: [type, message]
      properties:
        type: { type: string, description: "not_a_company | possible_duplicate" }
        message: { type: string }
      additionalProperties: true
    DraftProfile:
      type: object
      description: Optional company profile facts. Each field's value may be null when unavailable.
      properties:
        sector: { $ref: "#/components/schemas/DraftField" }
        business_model: { $ref: "#/components/schemas/DraftField" }
        hq: { $ref: "#/components/schemas/DraftField" }
        headcount_band: { $ref: "#/components/schemas/DraftField" }
        revenue_band: { $ref: "#/components/schemas/DraftField" }
        funding_stage: { $ref: "#/components/schemas/DraftField" }
        funding_round: { $ref: "#/components/schemas/DraftField" }
        unverified: { type: array, items: { $ref: "#/components/schemas/UnverifiedClaim" } }
    DraftCompensation:
      type: object
      description: Optional work-life-balance and review facts. Rating values are numbers from 0 to 5; counts are nonnegative integers. review_quotes.value is an array of at most five {text, sourceUrl, sourceName, date} objects, with text up to 300 characters and absolute http(s) source URLs without credentials.
      properties:
        wlb_rating: { $ref: "#/components/schemas/DraftField" }
        wlb_review_count: { $ref: "#/components/schemas/DraftField" }
        review_summary: { $ref: "#/components/schemas/DraftField" }
        review_quotes: { $ref: "#/components/schemas/DraftField" }
        unverified: { type: array, items: { $ref: "#/components/schemas/UnverifiedClaim" } }
    DraftRole:
      type: object
      description: Research-only role facts retained in the approved snapshot; not yet published to booking JDs or interview briefs.
      required: [role_key, title, level, specialization, yoe_min, yoe_max, ctc_min_lpa, ctc_max_lpa, ctc_source_count, jd, interview_process]
      properties:
        role_key: { type: string }
        title: { $ref: "#/components/schemas/DraftField" }
        level: { $ref: "#/components/schemas/DraftField", description: "Unavailable when the sources do not support a level; unknown levels remain unknown." }
        specialization: { $ref: "#/components/schemas/DraftField" }
        yoe_min: { $ref: "#/components/schemas/DraftField" }
        yoe_max: { $ref: "#/components/schemas/DraftField", description: "Unavailable when no upper experience bound is supported; never capped by an invented maximum." }
        ctc_min_lpa: { $ref: "#/components/schemas/DraftField", description: "Derived median lower bound using only observations explicitly labelled total_ctc, after outlier removal. Unspecified LPA pay is excluded. INR annual LPA." }
        ctc_max_lpa: { $ref: "#/components/schemas/DraftField", description: "Derived median of reported upper bounds from total_ctc observations only. Open-ended observations do not support this field; unavailable if no upper bound is reported. INR annual LPA." }
        ctc_source_count: { type: integer, minimum: 0, description: "Distinct source URLs contributing explicit total_ctc observations to the derived range after outlier removal; excludes unspecified pay. Zero when no supported range can be derived." }
        jd: { $ref: "#/components/schemas/DraftField" }
        interview_process: { $ref: "#/components/schemas/DraftField", description: "Official (company-published) process passages only." }
        employment_type: { $ref: "#/components/schemas/DraftField", description: "full_time | intern | contract" }
        job_ids: { $ref: "#/components/schemas/DraftField", description: "Job codes from official posting URLs and role titles." }
        required_skills: { $ref: "#/components/schemas/DraftField" }
        preferred_skills: { $ref: "#/components/schemas/DraftField" }
        tech_stack: { $ref: "#/components/schemas/DraftField" }
        locations: { $ref: "#/components/schemas/DraftField", description: "Indian cities, normalized names." }
        ctc_observations: { $ref: "#/components/schemas/DraftField", description: "Source-reported pay, including observations excluded from the derived total-CTC range. Array of {min_lpa, max_lpa, basis: total_ctc | lpa_unspecified, source_url, source_name, tier, date}. lpa_unspecified means the source reports annual INR LPA but does not establish total CTC; do not label it verified CTC. A null max_lpa is open-ended, not a capped range." }
        reported_interview_process: { $ref: "#/components/schemas/DraftField", description: "Array of {text, evidence_type: candidate_report | secondhand, source_url, source_name, date}; not official policy." }
        unverified: { type: array, items: { $ref: "#/components/schemas/UnverifiedClaim" } }
    CompanyDraft:
      type: object
      required: [draft_id, company_id, version, run_id, status, created_at, snapshot, conflicts, diff]
      properties:
        draft_id: { type: string }
        company_id: { type: string }
        version: { type: integer }
        run_id: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected, superseded] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string, nullable: true }
        decision_note: { type: string, nullable: true }
        notes: { type: array, items: { type: string }, description: Research limitations such as roles omitted by the run cap. }
        snapshot:
          type: object
          required: [identity]
          properties:
            identity:
              type: object
              required: [name, website, aliases]
              properties:
                name: { $ref: "#/components/schemas/DraftField" }
                website: { $ref: "#/components/schemas/DraftField" }
                aliases: { $ref: "#/components/schemas/DraftField" }
            profile: { $ref: "#/components/schemas/DraftProfile" }
            compensation: { $ref: "#/components/schemas/DraftCompensation" }
            roles: { type: array, items: { $ref: "#/components/schemas/DraftRole" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/DraftConflict" } }
        diff: { type: array, items: { $ref: "#/components/schemas/DraftChange" }, description: Changes against the last approved draft. }
        coverage: { $ref: "#/components/schemas/DraftCoverage" }
    CompanyDraftResponse:
      type: object
      required: [company, draft]
      properties:
        company: { $ref: "#/components/schemas/AdminCompany" }
        draft: { $ref: "#/components/schemas/CompanyDraft" }
    DraftDecisionRequest:
      type: object
      properties:
        note: { type: string, maxLength: 1000 }
    AdminCompanyList:
      type: object
      required: [companies, researchAvailable]
      properties:
        companies: { type: array, items: { $ref: "#/components/schemas/AdminCompany" } }
        researchAvailable: { type: boolean, description: false when the AI service could not be reached (research is null on every row). }
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        website: { type: string, nullable: true, description: "http(s) URL; a bare domain gets https://." }
        aliases: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        website: { type: string, nullable: true }
        aliases: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        status: { type: string, enum: [active, archived] }
    SeedResult:
      type: object
      required: [companies, inserted, backfilled, total]
      properties:
        companies: { type: integer }
        inserted: { type: integer }
        backfilled: { type: integer }
        total: { type: integer }
    ResearchTarget:
      type: object
      required: [id, name, slug, website, aliases]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        website: { type: string, nullable: true }
        aliases: { type: array, items: { type: string } }

    ResearchMode: { type: string, enum: [live, record, replay] }
    ResearchLevel: { type: string, enum: [trace, debug, info, warn, error] }
    ResearchRunStatus: { type: string, enum: [queued, running, pausing, paused, stopping, stopped, completed, failed] }
    ResearchItemStatus: { type: string, enum: [queued, running, paused, done, failed, skipped, cancelled] }
    ResearchRunCounters:
      type: object
      required: [total, queued, running, paused, done, failed, skipped, cancelled]
      properties:
        total: { type: integer }
        queued: { type: integer }
        running: { type: integer }
        paused: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        cancelled: { type: integer }
    ResearchBudget:
      type: object
      required: [exa_used, exa_cap, llm_used, llm_cap, tokens_in, tokens_out]
      properties:
        exa_used: { type: integer }
        exa_cap: { type: integer }
        llm_used: { type: integer }
        llm_cap: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
    ResearchRun:
      type: object
      required: [run_id, trigger, mode, scope, company_ids, status, control, pause_reason, counters, budget, last_seq, created_at, started_at, finished_at, error]
      properties:
        run_id: { type: string }
        trigger: { type: string, enum: [admin, cron, cli] }
        mode: { $ref: "#/components/schemas/ResearchMode" }
        scope: { type: string, enum: [all, selected] }
        company_ids: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ResearchRunStatus" }
        control: { type: string, enum: [none, pause, stop] }
        pause_reason: { type: string, nullable: true, description: "admin | budget_exhausted" }
        requested_by: { type: string, nullable: true }
        counters: { $ref: "#/components/schemas/ResearchRunCounters" }
        budget: { $ref: "#/components/schemas/ResearchBudget" }
        last_seq: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        pipeline_version: { type: string }
    ResearchRunList:
      type: object
      required: [runs]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/ResearchRun" } }
    ResearchError:
      type: object
      required: [type, message]
      properties:
        type: { type: string }
        message: { type: string }
        traceback: { type: string }
        code_ref: { type: string, nullable: true, description: "Innermost pipeline frame, e.g. app/research/nodes/resolve.py:resolve." }
    ResearchNodeProgress:
      type: object
      properties:
        status: { type: string, enum: [running, ok, error] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        exa_calls: { type: integer }
        llm_calls: { type: integer }
        error: { type: string }
    ResearchItem:
      type: object
      required: [run_id, company_id, company_name, company_slug, position, status, attempts, current_node, last_node, nodes, draft_id, error]
      properties:
        run_id: { type: string }
        company_id: { type: string }
        company_name: { type: string }
        company_slug: { type: string }
        position: { type: integer }
        status: { $ref: "#/components/schemas/ResearchItemStatus" }
        attempts: { type: integer }
        current_node: { type: string, nullable: true }
        last_node: { type: string, nullable: true }
        nodes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ResearchNodeProgress" }
        draft_id: { type: string, nullable: true }
        error:
          allOf: [{ $ref: "#/components/schemas/ResearchError" }]
          nullable: true
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    ResearchRunDetail:
      type: object
      required: [run, items]
      properties:
        run: { $ref: "#/components/schemas/ResearchRun" }
        items: { type: array, items: { $ref: "#/components/schemas/ResearchItem" } }
    StartResearchRunRequest:
      type: object
      properties:
        scope: { type: string, enum: [all, selected], default: all, description: all = every company not researched in RESEARCH_STALE_AFTER_DAYS. }
        companyIds: { type: array, items: { type: string } }
        mode: { $ref: "#/components/schemas/ResearchMode" }
    ResearchBudgetUpdate:
      type: object
      properties:
        exaCap: { type: integer, minimum: 0 }
        llmCap: { type: integer, minimum: 0 }
    ResearchEvent:
      type: object
      required: [run_id, seq, ts, level, level_rank, type, message, span_id, company_id, node]
      properties:
        run_id: { type: string }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        level: { $ref: "#/components/schemas/ResearchLevel" }
        level_rank: { type: integer }
        type: { type: string, description: "run.* | item.* | span.start | span.end | log | cache.hit | conflict.detected | budget.* | draft.created | control.*" }
        message: { type: string }
        span_id: { type: string, nullable: true }
        company_id: { type: string, nullable: true }
        node: { type: string, nullable: true }
        data: { description: Structured detail (any JSON). }
        data_ref: { type: string, nullable: true, description: Payload id when data exceeded 32 KB. }
    ResearchEventPage:
      type: object
      required: [events, last_seq]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/ResearchEvent" } }
        last_seq: { type: integer }
    ResearchSpan:
      type: object
      required: [span_id, parent_id, run_id, company_id, node, kind, name, status, started_at, ended_at, duration_ms, attrs, error]
      properties:
        span_id: { type: string }
        parent_id: { type: string, nullable: true }
        run_id: { type: string }
        company_id: { type: string, nullable: true }
        node: { type: string, nullable: true }
        kind: { type: string, enum: [run, company, node, exa, llm, cache, merge, normalize, db] }
        name: { type: string }
        status: { type: string, enum: [running, ok, error, cancelled] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, nullable: true }
        attrs: { type: object, additionalProperties: true }
        input_ref: { type: string, nullable: true }
        output_ref: { type: string, nullable: true }
        error:
          allOf: [{ $ref: "#/components/schemas/ResearchError" }]
          nullable: true
    ResearchSpanList:
      type: object
      required: [spans]
      properties:
        spans: { type: array, items: { $ref: "#/components/schemas/ResearchSpan" } }
    ResearchSpanDetail:
      allOf:
        - $ref: "#/components/schemas/ResearchSpan"
        - type: object
          properties:
            input: { description: Full input (any JSON). }
            output: { description: Full output (any JSON). }
    ResearchSpanDetailResponse:
      type: object
      required: [span, logs]
      properties:
        span: { $ref: "#/components/schemas/ResearchSpanDetail" }
        logs: { type: array, items: { $ref: "#/components/schemas/ResearchEvent" } }
