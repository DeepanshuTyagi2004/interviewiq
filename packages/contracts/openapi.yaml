        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not an admin., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: "`user_not_found`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`last_admin` — the change would remove the last ADMIN.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies:
    get:
      operationId: listAdminCompanies
