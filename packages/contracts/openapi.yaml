      summary: Every company with its research state (research is null when the AI service is unreachable).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Companies., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompanyList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCompany
      tags: [admin-companies]
      summary: Add a company to research. It starts unpublished (students see it after an admin approves its first draft).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCompanyRequest" } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: "`invalid_company` | `invalid_website` | `invalid_aliases`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`company_exists` — the slug is taken.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/seed:
    post:
      operationId: seedCompanies
      tags: [admin-companies]
      summary: Load the starter catalogue (upsert-only; never deletes).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Seed result., content: { application/json: { schema: { $ref: "#/components/schemas/SeedResult" } } } }
  /api/v1/admin/companies/{companyId}:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCompany
      tags: [admin-companies]
      summary: Edit identity fields or archive. The slug never changes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCompanyRequest" } } }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: "`invalid_company` | `invalid_website` | `invalid_aliases` | `invalid_status`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCompany
      tags: [admin-companies]
      summary: Delete the company with its JDs and role configs.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/companies/{companyId}/enrichment:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Admin]
      operationId: getCompanyEnrichment
      summary: Read the enrichment draft, prefilling available research on first open (ADMIN only).
      responses:
        "200": { description: Current draft and publication metadata., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
    put:
      tags: [Admin]
      operationId: saveCompanyEnrichment
      summary: Save an incomplete draft using optimistic revision (ADMIN only).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentWriteRequest" } } }
      responses:
        "200": { description: Saved draft., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "409": { description: Stale revision; reload before saving. }
  /api/v1/admin/companies/{companyId}/enrichment/prefill:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: prefillCompanyEnrichment
      summary: Fill blank unverified fields from available research without replacing saved values (ADMIN only).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentPrefillRequest" } } }
      responses:
        "200": { description: Current draft; revision advances only when values change., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "409": { description: Stale revision. }
        "502": { description: Research service unavailable; draft unchanged. }
  /api/v1/admin/companies/{companyId}/enrichment/publish:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      operationId: publishCompanyEnrichment
      summary: Atomically publish verified company, roles and linear round sequences (ADMIN only).
      description: Archived companies must first be restored. Existing JD role, level and specialization are immutable; add a new role to change identity.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentWriteRequest" } } }
      responses:
        "200": { description: Immediately published., content: { application/json: { schema: { $ref: "#/components/schemas/EnrichmentResponse" } } } }
        "400": { description: Invalid or unverified content. }
        "409": { description: Stale revision, archived company or changed JD identity; no changes published. }
  /api/v1/admin/companies/{companyId}/draft:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCompanyDraft
      tags: [admin-companies]
      summary: The newest research draft (any status) with the company, for the review view.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Draft., content: { application/json: { schema: { $ref: "#/components/schemas/CompanyDraftResponse" } } } }
        "404": { description: "`company_not_found` | `draft_not_found` (no research has produced a draft yet).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/{companyId}/draft/{draftId}/approve:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveCompanyDraft
      tags: [admin-companies]
      summary: Approve a pending draft and publish its identity, profile and compensation onto the company.
      description: Roles remain in the approved research snapshot; this does not publish JDs, booking configurations or interview briefs. Missing or unavailable profile and compensation values preserve existing published facts.
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DraftDecisionRequest" } } }
      responses:
        "200": { description: The published company., content: { application/json: { schema: { $ref: "#/components/schemas/AdminCompany" } } } }
        "400": { description: Invalid draft values; the company is not changed., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`draft_stale` | `draft_not_pending` | `draft_not_approvable` (research says it is not a company).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/companies/{companyId}/draft/{draftId}/reject:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: draftId, in: path, required: true, schema: { type: string } }
    post:
      operationId: rejectCompanyDraft
      tags: [admin-companies]
      summary: Reject a pending draft. The company stays as it was.
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/DraftDecisionRequest" } } }
      responses:
        "204": { description: Rejected. }
        "409": { description: "`draft_stale` | `draft_not_pending`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs:
    get:
      operationId: listResearchRuns
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Newest first., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunList" } } } }
        "502": { description: "`ai_service_unreachable`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: startResearchRun
      tags: [admin-research]
      summary: Start a run. Only one run may be active (queued, running, pausing, paused or stopping).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartResearchRunRequest" } } }
      responses:
        "201": { description: The new run., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "400": { description: "`no_companies` | `invalid_mode`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "`run_active`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: "`targets_unavailable` | `research_disabled`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: getResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Run with its items., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/research/runs/{runId}/pause:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: pauseResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pausing., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/resume:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: resumeResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Resumed., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/stop:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    post:
      operationId: stopResearchRun
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Stopping or stopped., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "409": { description: "`invalid_transition`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/budget:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    patch:
      operationId: updateResearchBudget
      tags: [admin-research]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResearchBudgetUpdate" } } }
      responses:
        "200": { description: Updated run., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "400": { description: "`invalid_budget` — negative, or below calls already made.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /api/v1/admin/research/runs/{runId}/events:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: listResearchEvents
      tags: [admin-research]
      summary: Trace events, ascending by seq. With beforeSeq, the newest `limit` events before it (still ascending).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: afterSeq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: beforeSeq, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/ResearchLevel" } }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: node, in: query, schema: { type: string } }
        - { name: type, in: query, description: Event type prefix, e.g. `span.`, schema: { type: string } }
        - { name: spanId, in: query, schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the message., schema: { type: string } }
      responses:
        "200": { description: A page of events., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchEventPage" } } } }
  /api/v1/admin/research/runs/{runId}/spans:
    parameters: [{ $ref: "#/components/parameters/ResearchRunId" }]
    get:
      operationId: listResearchSpans
      tags: [admin-research]
      summary: The run's span tree, flat (parent_id links), without inputs/outputs.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: companyId, in: query, schema: { type: string } }
      responses:
        "200": { description: Spans by start time., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchSpanList" } } } }
  /api/v1/admin/research/spans/{spanId}:
    parameters:
      - { name: spanId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
    get:
      operationId: getResearchSpan
      tags: [admin-research]
      summary: One span with its full input/output (offloaded payloads resolved) and its log events.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The span., content: { application/json: { schema: { $ref: "#/components/schemas/ResearchSpanDetailResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/internal/brief-problems:
    get:
      tags: [internal-research]
      operationId: listBriefProblems
      summary: Named problems from the admin-published briefs, for the AI service's problem-bank collector (internal key).
      responses:
        "200":
          description: One entry per brief with at least one round that carries problems.
          content:
            application/json:
              schema:
                type: object
                required: [briefs]
                properties:
                  briefs:
                    type: array
                    items:
                      type: object
                      required: [company, final_experience]
                      properties:
                        company: { type: string }
                        final_experience:
                          type: object
                          required: [rounds]
                          properties:
                            rounds:
                              type: array
                              items:
                                type: object
                                required: [type, difficulty, topics, problems]
                                properties:
                                  type: { type: string }
                                  difficulty: { type: string, enum: [easy, medium, hard] }
                                  topics: { type: array, items: { type: string } }
                                  problems: { type: array, items: { type: string } }
  /api/v1/internal/research-targets:
    get:
      operationId: listResearchTargets
      tags: [internal-research]
      summary: Every active company (published or not) for the research run.
      security: [{ internalApiKey: [] }]
      responses:
        "200":
          description: Targets.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ResearchTarget" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/interviews/sessions/{sessionId}/live/warm:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: warmLiveInterviewSession
      tags: [interview-sessions]
      summary: Get the interviewer into the room while the candidate reads the instructions.
      description: >
        Best effort and idempotent. For a PREP_READY round the live interviewer is available for (or one that is already
        LIVE_IN_PROGRESS) it dispatches the interviewer into the room unless one is already there or on its way, so the
        interviewer is waiting when the candidate enters. It changes nothing else: no status change, no seen problems, no
        clock. Any other round answers `warming: false`. Only the owning candidate may call this.
      security: [{ bearerAuth: [] }]
      responses:
        "403": { description: "`interview_access_required` — the account has the USER role and cannot run interviews.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "200":
          description: Whether an interviewer is in the room or on its way.
          content: { application/json: { schema: { $ref: "#/components/schemas/WarmLiveResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/interviews/live/readiness:
    get:
      operationId: getLiveInterviewerReadiness
      tags: [interview-sessions]
      summary: Whether the live interviewer is up.
      description: >
        Asks the AI service for its health (a short timeout, which also wakes a sleeping dev host). `ready` while the voice worker
        is beating (it registered with LiveKit and has not gone quiet); `waking` when the service is unreachable or slow, or its worker
        is down. With `sessionId` for a round that could go live, a down worker is also started: dispatching the interviewer makes
        LiveKit Cloud start a worker it scaled to zero. Never an error status: a failed check is `waking`. Any signed-in role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: query
          required: false
          description: The round whose room the interviewer must be in.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The interviewer's readiness.
          content: { application/json: { schema: { $ref: "#/components/schemas/LiveReadinessResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/interviews/sessions/{sessionId}/live/end:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: endLiveInterviewSession
      tags: [interview-sessions]
      summary: End the live round from the candidate's side (the fallback when the interviewer doesn't answer End).
      description: Idempotent; a round that already ended returns its stored result with alreadyEnded true.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The end result.
          content: { application/json: { schema: { $ref: "#/components/schemas/CandidateLiveEndResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`session_not_live`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/internal/live/sessions/{sessionId}/context:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getLiveContext
      tags: [internal-live]
      summary: The round and a minimal profile for the interviewer worker (while the round is PREP_READY or LIVE_IN_PROGRESS).
      security: [{ internalApiKey: [] }]
      responses:
        "200":
          description: The context.
          content: { application/json: { schema: { $ref: "#/components/schemas/LiveContext" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`session_not_live`: the session is neither PREP_READY nor LIVE_IN_PROGRESS."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/internal/live/sessions/{sessionId}/end:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: endLiveSessionInternal
      tags: [internal-live]
      summary: The interviewer worker ends the live round (idempotent).
      security: [{ internalApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LiveEndRequest" } } }
      responses:
        "200":
          description: The end result.
          content: { application/json: { schema: { $ref: "#/components/schemas/LiveEndResult" } } }
        "400":
          description: "`live_end_bad_request`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`session_not_live`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/v1/intelligence/evaluations/runs:
    get:
      operationId: listEvaluationRuns
      tags: [admin-evaluations]
      summary: Evaluation runs, newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: company, in: query, schema: { type: string } }
        - { name: round_type, in: query, schema: { $ref: "#/components/schemas/RoundType" } }
        - { name: trigger, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string } }
        - { name: candidate_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, description: The previous page's next_cursor., schema: { type: string } }
      responses:
        "200":
          description: A page of runs.
          content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRunList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
  /api/v1/intelligence/evaluations/runs/{runId}:
    get:
      operationId: getEvaluationRun
      tags: [admin-evaluations]
      summary: One run with raw grader outputs, disagreements, tiebreaks and timings.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run.
          content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRunDetail" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { description: "`run_not_found`" }
  /api/v1/intelligence/evaluations/sessions/{sessionId}/rerun:
    post:
      operationId: rerunSessionEvaluation
      tags: [admin-evaluations]
      summary: Re-grade a completed session from scratch (a fresh `admin` run).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The new run.
          content: { application/json: { schema: { $ref: "#/components/schemas/EvaluationRerunStarted" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`session_not_completed`" }
  /api/v1/intelligence/blueprints/candidates:
    get:
      operationId: listBlueprintBenchCandidates
      tags: [admin-blueprints]
      summary: Onboarded candidates for the bench picker.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Candidates sorted by name.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BlueprintBenchCandidate" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
  /api/v1/intelligence/blueprints/runs:
    get:
      operationId: listBlueprintRuns
      tags: [admin-blueprints]
      summary: Blueprint runs, newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BlueprintRunStatus" } }
        - { name: company, in: query, schema: { type: string } }
        - { name: round_type, in: query, schema: { $ref: "#/components/schemas/RoundType" } }
        - { name: trigger, in: query, schema: { $ref: "#/components/schemas/BlueprintTrigger" } }
        - { name: candidate_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, description: The previous page's next_cursor., schema: { type: string } }
      responses:
        "200":
          description: A page of runs.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
  /api/v1/intelligence/blueprints/runs/{runId}:
    get:
      operationId: getBlueprintRun
      tags: [admin-blueprints]
      summary: One run with its full trace, request and blueprint.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunDetail" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { description: "`run_not_found`" }
  /api/v1/intelligence/blueprints/runs/{runId}/rerun:
    post:
      operationId: rerunBlueprint
      tags: [admin-blueprints]
      summary: Re-run a run's inputs as a bench run (never touches the session).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bypassAnswerKeyCache: { type: boolean }
                ignoreExclusions: { type: boolean }
      responses:
        "200":
          description: The new run.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunStarted" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { description: "`run_not_found`" }
  /api/v1/intelligence/blueprints/bench:
    post:
      operationId: startBlueprintBench
      tags: [admin-blueprints]
      summary: Prepare a blueprint for a candidate + JD (or practice loop round) without booking.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintBenchRequest" } } }
      responses:
        "200":
          description: The bench run.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunStarted" } } }
        "400": { description: "`blueprint_bad_request`" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
  /api/v1/intelligence/blueprints/sessions/{sessionId}/versions:
    get:
      operationId: listBlueprintVersions
      tags: [admin-blueprints]
      summary: A session's blueprint versions, newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Versions.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintVersionList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
  /api/v1/intelligence/blueprints/sessions/{sessionId}/diff:
    get:
      operationId: diffBlueprintVersions
      tags: [admin-blueprints]
      summary: Structured diff between two versions of a session's blueprint.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - { name: from, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: to, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The diff.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintDiff" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { description: "`run_not_found`: unknown version." }
  /api/v1/intelligence/blueprints/answer-keys/{roundType}/{slug}:
    get:
      operationId: getBlueprintAnswerKeys
      tags: [admin-blueprints]
      summary: Cached answer keys for one problem (every key version and content hash).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roundType, in: path, required: true, schema: { $ref: "#/components/schemas/RoundType" } }
        - { name: slug, in: path, required: true, description: The bank slug (may contain "/")., schema: { type: string } }
      responses:
        "200":
          description: Keys.
          content: { application/json: { schema: { $ref: "#/components/schemas/AnswerKeyList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }

  # ------------------------------------------------------------------ #
  # Internal (interviewiq-api ↔ interviewiq-ai-service, X-Internal-Api-Key) #
  # ------------------------------------------------------------------ #
  /blueprints/runs:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    post:
      operationId: startBlueprintRun
      tags: [internal-blueprints]
      summary: Start a session's blueprint run (one running run per session).
      description: >
        Returns at once; the run executes in the background (context → selection → answer keys →
        persona → personalization → playbooks → policies → validate). A second start while one is
        running returns the live run with `existing: true`.
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunRequest" } } }
      responses:
        "200":
          description: Started (or the live run).
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunStarted" } } }
        "400": { description: Session runs need a session_id. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /blueprints/runs/{runId}:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    get:
      operationId: getBlueprintRunStatus
      tags: [internal-blueprints]
      summary: Compact run status for the reconcile job and the live stepper.
      security:
        - internalApiKey: []
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status.
          content: { application/json: { schema: { $ref: "#/components/schemas/BlueprintRunStatusView" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /blueprints/runs/{runId}/cancel:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    post:
      operationId: cancelBlueprintRun
      tags: [internal-blueprints]
      summary: Cancel a run.
      security:
        - internalApiKey: []
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Whether a running run was cancelled.
          content: { application/json: { schema: { type: object, required: [cancelled], properties: { cancelled: { type: boolean } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /blueprints/sessions/{sessionId}:
    servers:
      - url: http://localhost:8000
        description: interviewiq-ai-service (internal, X-Internal-Api-Key)
    get:
      operationId: getSessionBlueprint
      tags: [internal-blueprints]
      summary: A session's current blueprint (or `version`). Never sent to a browser.
      security:
        - internalApiKey: []
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The blueprint.
          content: { application/json: { schema: { $ref: "#/components/schemas/Blueprint" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResearchRunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  headers:
    RefreshTokenCookie:
      description: >
        `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=<Lax|Strict|None>`
        (+ `Secure` in production). Never readable by JavaScript.
      schema:
        type: string

  responses:
    InvalidRequest:
      description: "`invalid_request` — the body failed validation; `message` is human-readable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example: { code: invalid_request, message: Password must be at least 8 characters. }
    InvalidTokenOrRequest:
      description: >
        `invalid_token` — the link's token is unknown, expired or already used (ask for a new
        link). `invalid_request` — the body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            invalid_token:
              value: { code: invalid_token, message: This link is invalid or has expired. Request a new one. }
            invalid_request:
              value: { code: invalid_request, message: Password must be at least 8 characters. }
    RateLimited:
      description: "`rate_limited` — too many attempts; retry after `Retry-After` seconds."
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example: { code: rate_limited, message: Too many attempts. Please wait a few minutes and try again. }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found (or not owned by the caller).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ValidationControlSettings:
      type: object
      required: [linkedinImportEnabled, requireSectionReview]
      properties:
        linkedinImportEnabled: { type: boolean }
        requireSectionReview: { type: boolean }
    ValidationControlsResponse:
      type: object
      required: [settings, updatedAt, updatedBy]
      properties:
        settings: { $ref: "#/components/schemas/ValidationControlSettings" }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true, description: Admin user ID that last changed the settings. }
    ProfileTraceStage:
      type: object
      required: [id, status, startedAt, finishedAt, durationMs, detail]
      properties:
        id: { type: string }
        status: { type: string, enum: [completed, failed, skipped] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        detail: { type: string }
    ProfileTraceSource:
      type: object
      required: [source, status, fetchedAt, ageDays, contentHash, extractedFieldCounts, safeSummary]
      properties:
        source: { type: string, description: "RESUME, GITHUB, LEETCODE, LINKEDIN or a coding platform (CODEFORCES, TUF, ...)." }
        status: { type: string, enum: [available, missing, unsupported, partial, excluded] }
        fetchedAt: { type: string, format: date-time, nullable: true }
        ageDays: { type: number, nullable: true }
        contentHash: { type: string, nullable: true }
        extractedFieldCounts: { type: object, additionalProperties: { type: integer } }
        safeSummary: { type: object, additionalProperties: true }
    ProfileTraceProviderCheck:
      type: object
      required: [provider, mode, configured, used, status, retrievedAt, reason]
      properties:
        provider: { type: string }
        mode: { type: string }
        configured: { type: boolean }
        used: { type: boolean }
        status: { type: string, enum: [used, not_used, failed] }
        retrievedAt: { type: string, format: date-time, nullable: true }
        reason: { type: string }
    ProfileTraceComponent:
      allOf:
        - { $ref: "#/components/schemas/ProfileScoreComponent" }
        - type: object
          required: [availableWeight, formulaInput, subFeatures]
          properties:
            availableWeight: { type: number }
            subFeatures:
              type: array
              description: Sub-features (or items) that formed this component, with relative weight and share of the component score. status missing = no source produced it, so it was counted as 0.
              items:
                type: object
                required: [key, value, weight, share]
                properties:
                  key: { type: string }
                  value: { type: number }
                  weight: { type: number }
                  share: { type: number }
                  status: { type: string, enum: [found, missing] }
            formulaInput:
              type: object
              nullable: true
              required: [score, weight]
              properties:
                score: { type: number }
                weight: { type: number }
    ProfileLiveTraceResponse:
      type: object
      required: [traceId, userId, startedAt, finishedAt, stages, sources, providerChecks, score, confidence, coverage, classification, algorithm, components, evidence, eligibility, warnings, formula, snapshot, llmCalls, stackTrace, copyText]
      properties:
        traceId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        stages: { type: array, items: { $ref: "#/components/schemas/ProfileTraceStage" } }
        sources: { type: array, items: { $ref: "#/components/schemas/ProfileTraceSource" } }
        providerChecks: { type: array, items: { $ref: "#/components/schemas/ProfileTraceProviderCheck" } }
        score: { type: number, nullable: true }
        confidence: { type: number }
        coverage: { type: number }
        classification: { $ref: "#/components/schemas/ProfileScoreClassification" }
        algorithm:
          type: object
          required: [version, configHash, inputHash]
          properties:
            version: { type: string }
            configHash: { type: string }
            inputHash: { type: string }
        components: { type: array, items: { $ref: "#/components/schemas/ProfileTraceComponent" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/ProfileScoreEvidence" } }
        eligibility:
          type: object
          required: [eligible, reasons]
          properties:
            eligible: { type: boolean }
            reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        formula:
          type: object
          required: [expression, availableWeight, inputs]
          properties:
            expression: { type: string }
            availableWeight: { type: number }
            inputs: { type: array, items: { $ref: "#/components/schemas/ProfileTraceComponent" } }
        snapshot: { $ref: "#/components/schemas/ProfileScoreSnapshot" }
        llmCalls: { type: array, items: { $ref: "#/components/schemas/ProfileTraceLlmCall" } }
        stackTrace: { type: string }
        copyText: { type: string }
    ProfileTraceLlmCall:
      type: object
      required: [callId, call, status, itemType, itemTitle, durationMs, detail, error]
      properties:
        callId: { type: string }
        call: { type: string, enum: [item-assessment, company-context] }
        status: { type: string, enum: [completed, failed, reused, skipped] }
        itemType: { type: string, enum: [project, experience, internship], nullable: true }
        itemTitle: { type: string, nullable: true }
        durationMs: { type: number, nullable: true }
        detail: { type: string }
        error:
          type: object
          nullable: true
          required: [name, message, stack]
          properties:
            name: { type: string }
            message: { type: string }
            stack: { type: string, nullable: true }
    ProfileLiveTraceEvent:
      type: object
      description: One NDJSON line of the live trace. `data` is the step's structured detail; for `result` it is a ProfileLiveTraceResponse.
      required: [seq, ts, elapsedMs, kind, stage, level, message]
      properties:
        seq: { type: integer }
        ts: { type: string, format: date-time }
        elapsedMs: { type: number }
        kind: { type: string, enum: [stage, log, llm, engine, result, error] }
        stage: { type: string }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }
        data: {}
    LinkedInSectionKey:
      type: string
      enum: [headline, about, experience, education, projects, skills, achievements, certifications, publications, patents, courses, languages, volunteering]
    LinkedInImportSection:
      type: object
      required: [key, label, entries, sourceFile]
      properties:
        key: { $ref: "#/components/schemas/LinkedInSectionKey" }
        label: { type: string }
        entries: { type: array, items: { type: string } }
        sourceFile: { type: string, nullable: true, description: Uploaded PDF filename (display only). Null for legacy URL snapshots. }
    LinkedInImportStatus:
      type: object
      description: Confirmed snapshot receipt, never proof of account ownership or employment. New imports are PDFs; legacy URL snapshots stay readable until replaced.
      required: [connected, importedAt, method, sections, warnings, sourceUrl, provider, retrievedAt]
      properties:
        connected: { type: boolean }
        importedAt: { type: string, format: date-time, nullable: true }
        method: { type: string, nullable: true, enum: [pdf, url, null] }
        sections: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        sourceUrl: { type: string, format: uri, nullable: true, description: Profile URL found in the PDF, or the scraped URL of a legacy snapshot. }
        provider: { type: string, nullable: true, enum: [exa, firecrawl, null], description: Null for PDF imports; Firecrawl/Exa only on legacy URL snapshots. }
        retrievedAt: { type: string, format: date-time, nullable: true }
    LinkedInImportDraft:
      type: object
      description: Owner-bound derived preview expires after 24 hours. The uploaded PDF is not stored. Profile level is null and never inferred from imported career text.
      required: [id, createdAt, expiresAt, method, profileRevision, profile, sections, warnings, sourceUrl, provider, retrievedAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        method: { type: string, enum: [pdf, url] }
        profileRevision: { type: string, nullable: true }
        profile: { $ref: "#/components/schemas/CandidateProfileResponse" }
        sections: { type: array, items: { $ref: "#/components/schemas/LinkedInImportSection" } }
        warnings: { type: array, items: { type: string } }
        sourceUrl: { type: string, format: uri, nullable: true }
        provider: { type: string, nullable: true, enum: [exa, firecrawl, null] }
        retrievedAt: { type: string, format: date-time, nullable: true }
    LinkedInImportConfirmation:
      type: object
      required: [profile, import]
      properties:
        profile: { allOf: [{ $ref: "#/components/schemas/CandidateProfileResponse" }], nullable: true }
        import: { $ref: "#/components/schemas/LinkedInImportStatus" }
    CandidateProfileEducation:
      type: object
      required: [institution, degree, field, startYear, endYear, grade]
      properties:
        institution: { type: string, nullable: true }
        degree: { type: string, nullable: true }
        field: { type: string, nullable: true }
        startYear: { type: string, nullable: true }
        endYear: { type: string, nullable: true }
        grade: { type: string, nullable: true }
    CandidateProfileExperience:
      type: object
      required: [company, title, startDate, endDate, location, bullets]
      properties:
        company: { type: string, nullable: true }
        title: { type: string, nullable: true }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        location: { type: string, nullable: true }
        bullets: { type: array, nullable: true, items: { type: string } }
        link: { type: string, format: uri, nullable: true, description: Explicitly supplied live/company URL. }
    CandidateProfileProject:
      type: object
      required: [name, description, tech, bullets, link]
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        tech: { type: array, nullable: true, items: { type: string } }
        bullets: { type: array, nullable: true, items: { type: string } }
        link: { type: string, nullable: true }
    CandidateProfileLinks:
      type: object
      required: [github, leetcode, linkedin]
      properties:
        github: { type: string, nullable: true }
        leetcode: { type: string, nullable: true }
        linkedin: { type: string, nullable: true }
        portfolioWebsite: { type: string, format: uri, nullable: true }
    CandidateProfileDetails:
      type: object
      required: [fullName, email, phone, location, headline, targetRole, targetJdId, education, experience, projects, skills, achievements, detectedLinks, resumeFilename]
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        location: { type: string, nullable: true }
        headline: { type: string, nullable: true }
        portfolioWebsite: { type: string, format: uri, nullable: true, description: Personal or portfolio website explicitly supplied by the candidate or extracted from the resume. }
        targetRole: { type: string, nullable: true }
        targetJdId: { type: string, format: uuid, nullable: true }
        education: { type: array, items: { $ref: "#/components/schemas/CandidateProfileEducation" } }
        experience: { type: array, items: { $ref: "#/components/schemas/CandidateProfileExperience" } }
        projects: { type: array, items: { $ref: "#/components/schemas/CandidateProfileProject" } }
        skills: { type: array, items: { type: string } }
        achievements: { type: array, items: { type: string } }
        detectedLinks: { $ref: "#/components/schemas/CandidateProfileLinks" }
        resumeFilename: { type: string, nullable: true }
    CandidateProfileResponse:
      allOf:
        - { $ref: "#/components/schemas/CandidateProfileDetails" }
        - type: object
          required: [level, resumeParsedAt, onboardingComplete]
          properties:
            level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
            legacyLevel: { type: string, nullable: true }
            resumeParsedAt: { type: string, format: date-time, nullable: true }
            onboardingComplete: { type: boolean }
    CandidateProfileRequest:
      allOf:
        - { $ref: "#/components/schemas/CandidateProfileDetails" }
        - type: object
          required: [complete]
          properties:
            level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
            complete: { type: boolean }
    ResumeParseRunResponse:
      type: object
      required: [status, profile, error]
      properties:
        status: { type: string, enum: [running, completed, failed] }
        profile: { allOf: [{ $ref: "#/components/schemas/CandidateProfileResponse" }], nullable: true }
        error: { type: string, nullable: true }
    EngineeringLevel:
      type: string
      enum: [intern, fresher, sde1, sde2, sde3, staff, principal, distinguished]
      description: Canonical user-choice enum across profiles, company JDs, processes, experiences and scoring. Target job level and current profile level are distinct choices using the same enum.
    NullableEngineeringLevel:
      type: string
      nullable: true
      enum: [intern, fresher, sde1, sde2, sde3, staff, principal, distinguished, null]
      description: Null only for unfinished profiles or unknown legacy records; never guess an engineering level.
    ProfileScoringSettings:
      type: object
      required: [declaredLevel, leaderboardOptIn]
      properties:
        declaredLevel: { $ref: "#/components/schemas/NullableEngineeringLevel", description: Effective CandidateProfile.level; compatibility fallback only for old field-absent profiles. }
        leaderboardOptIn: { type: boolean, default: false }
    ProfileScoreEvidence:
      type: object
      required: [id, source, path, claim, value, confidence, observedAt, verification, recencyFactor]
      properties:
        id: { type: string }
        source: { type: string }
        path: { type: string }
        claim: { type: string }
        value:
          oneOf:
            - { type: string }
            - { type: number }
        confidence: { type: number, minimum: 0, maximum: 100 }
        observedAt: { type: string, format: date-time, nullable: true }
        verification: { type: string, enum: [collector, self_reported] }
        recencyFactor: { type: number, minimum: 0, maximum: 1 }
        feature: { type: string, description: "V5 sub-feature key this evidence supports (e.g. codeforces_contest, technical_depth)." }
        rawValue: { description: "V5 raw observation before normalization (platform-native units or extracted structure)." }
        normalizedValue: { type: number, nullable: true, description: "V5 0-100 value after platform- or policy-specific normalization." }
        scoreContribution: { type: number, nullable: true }
        evidenceType: { type: string, enum: [DIRECT, DERIVED, INFERRED, SELF_REPORTED, UNAVAILABLE] }
        algorithmVersion: { type: string }
        sourceUrl: { type: string, nullable: true }
        sourceTimestamp: { type: string, nullable: true }
        sourceMetadata: { type: object, additionalProperties: true }
        paths: { type: array, items: { type: string }, description: V3 attribution paths; repeated claims do not accumulate scoring or confidence credit. }
        provenance:
          type: array
          items:
            type: object
            required: [section, path, file, quote]
            properties:
              section: { type: string }
              path: { type: string }
              file: { type: string, nullable: true }
              quote: { type: string }
    ProfileScoreComponent:
      type: object
      required: [id, label, weight, score, contribution, evidenceIds, status]
      properties:
        id: { type: string }
        label: { type: string }
        weight: { type: number, minimum: 0, maximum: 100 }
        score: { type: number, nullable: true, minimum: 0, maximum: 100 }
        contribution: { type: number, nullable: true, minimum: 0, maximum: 100 }
        evidenceIds: { type: array, items: { type: string } }
        status:
          type: string
          enum: [available, missing, pending]
          description: missing = no current evidence (a core part then counts as 0, including when its AI assessment failed or has not run). pending appears only on older v5 snapshots, which left an unassessed part out.
        role:
          type: string
          enum: [core, bonus]
          description: >
            core = expected at the level and nothing else stands in for it (a gap is warned about); bonus = extra credit
            (a gap is a quiet 0 of its weight). Every part counts in proportion to its weight; missing = 0.
        counted: { type: boolean, description: "v5: whether the part is in the score (missing core counts as 0; a bonus counts when present; pending is left out)." }
    ProfileScoreSource:
      type: object
      required: [source, status, fetchedAt, ageDays, contentHash]
      properties:
        source: { type: string }
        status: { type: string, enum: [available, missing, unsupported, partial] }
        fetchedAt: { type: string, format: date-time, nullable: true }
        ageDays: { type: number, nullable: true }
        contentHash: { type: string, nullable: true }
        importMethod: { type: string, nullable: true, enum: [archive, pdf, text, url, null], description: Historic methods remain replayable; new imports are uploaded LinkedIn PDFs. }
        importedAt: { type: string, format: date-time, nullable: true }
        provider: { type: string, nullable: true, enum: [exa, firecrawl, null] }
        retrievedAt: { type: string, format: date-time, nullable: true, description: Retrieval time, not evidence of the profile's update time or verified career claims. }
    ProfileScoreClassification:
      type: object
      required: [declaredLevel, assessedLevel, confidence, reasons, warnings]
      properties:
        declaredLevel: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        assessedLevel: { $ref: "#/components/schemas/EngineeringLevel" }
        confidence: { type: number, minimum: 0, maximum: 100 }
        reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    ProfileScoreEvaluation:
      type: object
      description: >
        Provisional deterministic assessment. Score and coverage are 0–100; unknown evidence is null, not zero.
        From v5, source data is taken as correct (no confidence weighting): confidence is 100 when scored, else 0,
        and leaderboard eligibility depends only on the level's minimum coverage.
      required: [algorithmVersion, configHash, inputHash, asOf, status, score, confidence, coverage, level, classification, components, evidence, warnings, eligibility, sources]
      properties:
        algorithmVersion: { type: string }
        configHash: { type: string }
        inputHash: { type: string }
        asOf: { type: string, format: date-time }
        status: { type: string, enum: [scored, insufficient_evidence] }
        score: { type: number, nullable: true, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 100 }
        coverage: { type: number, minimum: 0, maximum: 100 }
        level: { $ref: "#/components/schemas/EngineeringLevel" }
        classification: { $ref: "#/components/schemas/ProfileScoreClassification" }
        components: { type: array, items: { $ref: "#/components/schemas/ProfileScoreComponent" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/ProfileScoreEvidence" } }
        warnings: { type: array, items: { type: string } }
        eligibility:
          type: object
          required: [eligible, reasons]
          properties:
            eligible: { type: boolean }
            reasons: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: "#/components/schemas/ProfileScoreSource" } }
    ProfileScoreSnapshot:
      allOf:
        - { $ref: "#/components/schemas/ProfileScoreEvaluation" }
        - type: object
          required: [id, calculatedAt, week, rank, percentile, cohortSize]
          properties:
            id: { type: string }
            calculatedAt: { type: string, format: date-time }
            week: { type: string, format: date, description: UTC Monday cohort week. }
            rank: { type: integer, nullable: true, minimum: 1 }
            percentile: { type: number, nullable: true, minimum: 0, maximum: 100 }
            cohortSize: { type: integer, minimum: 0 }
    ProfileScoreResponse:
      type: object
      required: [current, history, settings, assessment]
      properties:
        current:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProfileScoreSnapshot" }]
        history: { type: array, items: { $ref: "#/components/schemas/ProfileScoreSnapshot" } }
        settings: { $ref: "#/components/schemas/ProfileScoringSettings" }
        assessment: { $ref: "#/components/schemas/ProfileAssessmentStatus" }
    ProfileAssessmentStatus:
      type: object
      description: >
        The AI assessment behind Recalculate. `remaining` counts runs left in the user's rolling 7 days
        (the automatic first run counts); `nextAvailableAt` is when one frees up, only set when none is left.
      required: [available, inProgress, limit, remaining, nextAvailableAt]
      properties:
        available: { type: boolean, description: False when assessments are not enabled; Recalculate is then deterministic only. }
        inProgress: { type: boolean }
        limit: { type: integer }
        remaining: { type: integer, minimum: 0 }
        nextAvailableAt: { type: string, format: date-time, nullable: true }
    ProfileLeaderboardResponse:
      type: object
      required: [level, algorithmVersion, week, total, entries]
      properties:
        level: { $ref: "#/components/schemas/EngineeringLevel" }
        algorithmVersion: { type: string }
        week: { type: string, format: date }
        total: { type: integer, minimum: 0 }
        entries:
          type: array
          items:
            type: object
            required: [rank, displayName, score, confidence, percentile]
            properties:
              rank: { type: integer, minimum: 1 }
              displayName: { type: string }
              score: { type: number, minimum: 0, maximum: 100 }
              confidence: { type: number, minimum: 0, maximum: 100 }
              percentile: { type: number, nullable: true, minimum: 0, maximum: 100 }
    ProfileScoringConfig:
      type: object
      required: [version, beta, weights, normalizers, thresholds]
      properties:
        version: { type: string }
        beta: { type: boolean }
        weights:
          type: object
          description: Current v2 configurations require all eight rubrics. intern/distinguished are optional only to describe immutable six-rubric v1 replay data.
          required: [fresher, sde1, sde2, sde3, staff, principal]
          properties:
            intern: { type: object, additionalProperties: { type: number } }
            fresher: { type: object, additionalProperties: { type: number } }
            sde1: { type: object, additionalProperties: { type: number } }
            sde2: { type: object, additionalProperties: { type: number } }
            sde3: { type: object, additionalProperties: { type: number } }
            staff: { type: object, additionalProperties: { type: number } }
            principal: { type: object, additionalProperties: { type: number } }
            distinguished: { type: object, additionalProperties: { type: number } }
        normalizers: { type: object, additionalProperties: { type: number } }
        thresholds:
          type: object
          required: [minimumCoverage, minimumConfidence, minimumCohort]
          properties:
            minimumCoverage: { type: number, minimum: 0, maximum: 100 }
            minimumConfidence: { type: number, minimum: 0, maximum: 100 }
            minimumCohort: { type: integer, minimum: 2 }
    ProfileScoringJobStatus:
      type: object
      required: [enabled, status, lastStartedAt, lastCompletedAt, lastError, nextDueAt, processed, failed]
      properties:
        enabled: { type: boolean }
        status: { type: string, enum: [idle, running, completed, failed] }
        lastStartedAt: { type: string, format: date-time, nullable: true }
        lastCompletedAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        nextDueAt: { type: string, format: date-time, nullable: true }
        processed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    ProfileDiagnosticCheck:
      type: object
      required: [id, label, status, detail]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [pass, fail, warning, untested] }
        detail: { type: string }
    ProfileDiagnosticsResponse:
      type: object
      required: [checkedAt, checks, score, jobs, methodology]
      properties:
        checkedAt: { type: string, format: date-time }
        checks: { type: array, items: { $ref: "#/components/schemas/ProfileDiagnosticCheck" } }
        score:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProfileScoreResponse" }]
        jobs: { $ref: "#/components/schemas/ProfileScoringJobStatus" }
        methodology: { $ref: "#/components/schemas/ProfileScoringConfig" }
    CodingPlatform:
      type: string
      enum: [CODEFORCES, CODECHEF, ATCODER, TUF]
    PlatformConnection:
      type: object
      required: [platform, handle, status, connectedAt]
      properties:
        platform: { $ref: "#/components/schemas/CodingPlatform" }
        handle: { type: string }
        status: { type: string, enum: [SYNCING, SYNCED, FAILED, DEGRADED] }
        connectedAt: { type: string, format: date-time }
        lastRefreshedAt: { type: string, format: date-time }
        discoveredFrom: { type: string, description: "Set when the connection was made automatically from another profile's linked accounts (e.g. TUF)." }
    ApiError:
      type: object
      description: The stable { code, message } error envelope used across the api.
      required: [code, message]
      properties:
        code:
          type: string
          example: session_jd_not_found
        message:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; 1–100 characters after trimming.
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased before use.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 8–128 characters and not only whitespace. Not trimmed.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; matched case-insensitively.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: >
            Only the length is checked here (so a later, stricter password policy never locks
            out existing accounts); a wrong password is 401 `invalid_credentials`.

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: "HS256 JWT; send as `Authorization: Bearer <accessToken>`."
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds (900 by default).
          example: 900

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The `token` query parameter of the verification link.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The `token` query parameter of the reset link.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: The new password — same rules as `RegisterRequest.password`.

    Role:
      type: string
      description: USER cannot run interviews; CANDIDATE can; ADMIN can and manages users.
      enum: [USER, CANDIDATE, ADMIN]

    AdminUser:
      type: object
      required: [id, email, name, role, onboardingComplete, emailVerified, hasPassword, hasGoogle]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        onboardingComplete: { type: boolean }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean }
        hasGoogle: { type: boolean }

    CurrentUser:
      type: object
      required: [id, email, name, role, onboardingComplete, emailVerified, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        onboardingComplete:
          type: boolean
          description: True once the onboarding wizard is finished. Gates app entry vs /onboarding.
        emailVerified:
          type: boolean
          description: >
            The user proved control of `email` (verification link, reset link, or a Google
            sign-in where Google verified it).
        hasPassword:
          type: boolean
          description: The account can sign in with email + password (false = Google-only).

    UpdateUserRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    DeleteAccountRequest:
      type: object
      required: [confirmEmail]
      properties:
        confirmEmail:
          type: string
          description: Must equal the account's email (case-insensitive).
        password:
          type: string
          description: Required for accounts that have a password.

    AccountExport:
      type: object
      description: Everything the API holds about the account. Shape follows the stores; only `exportedAt` is fixed.
      required: [exportedAt]
      properties:
        exportedAt:
          type: string
          format: date-time
      additionalProperties: true

    NotificationChannel:
      type: object
      required: [interviewReminders, debriefReady, retakeAvailable, targetOpenings, weeklyDigest, productUpdates]
      properties:
        interviewReminders: { type: boolean }
        debriefReady: { type: boolean }
        retakeAvailable: { type: boolean }
        targetOpenings: { type: boolean }
        weeklyDigest: { type: boolean }
        productUpdates: { type: boolean }

    Preferences:
      type: object
      description: >
        Account-level settings (Settings → Account / Notifications / Privacy & data). Device-only
        settings (theme, reduced motion) never reach the server.
      required: [locale, interview, notifications, privacy, updatedAt]
      properties:
        locale:
          type: object
          required: [appLanguage, timezone, dateFormat, timeFormat, weekStart]
          properties:
            appLanguage: { type: string, enum: [en, hi, ta, te, bn, mr] }
            timezone:
              type: string
              nullable: true
              description: IANA zone; null follows the browser.
            dateFormat: { type: string, enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD] }
            timeFormat: { type: string, enum: [12h, 24h] }
            weekStart: { type: string, enum: [monday, sunday] }
        interview:
          type: object
          required: [language, voice, pace, captions, showTimer, deviceCheck, reminderLead]
          properties:
            language: { type: string, enum: [en, hinglish, hi] }
            voice: { type: string, enum: [warm, neutral, crisp] }
            pace: { type: string, enum: [slower, normal, faster] }
            captions: { type: boolean }
            showTimer: { type: boolean }
            deviceCheck: { type: boolean }
            reminderLead: { type: string, enum: [15m, 1h, 1d] }
        notifications:
          type: object
          required: [emailPaused, email, inApp]
          properties:
            emailPaused: { type: boolean }
            email:
              $ref: "#/components/schemas/NotificationChannel"
            inApp:
              $ref: "#/components/schemas/NotificationChannel"
        privacy:
          type: object
          required: [leaderboardVisibility, shareWithCollege, partnerDiscovery, improveWithMyData]
          properties:
            leaderboardVisibility:
              type: string
              enum: [name, anonymous, hidden]
              description: How an opted-in profile appears on the leaderboard.
            shareWithCollege: { type: boolean }
            partnerDiscovery: { type: boolean }
            improveWithMyData: { type: boolean }
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the user last changed a setting; null = never.

    PreferencesPatch:
      type: object
      description: Any subset of `Preferences` leaves (same shape, every field optional). Unknown keys are rejected.
      properties:
        locale:
          type: object
          additionalProperties: true
        interview:
          type: object
          additionalProperties: true
        notifications:
          type: object
          additionalProperties: true
        privacy:
          type: object
          additionalProperties: true

    RoundType:
      type: string
      description: >
        A live, human-conducted interview round InterviewIQ can mock. Online Assessment is
        intentionally excluded — it's an automated coding test, not a live round, so it isn't
        bookable/conductable here. (The ai-service brief pipeline still recognises OA when it
        describes companies' real hiring processes; that's a separate, internal vocabulary.)
      enum:
        - dsa
        - system-design
        - lld
        - behavioural
        - hiring-manager

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    SessionStatus:
      type: string
      description: >
        Interview session lifecycle. Prep (SCHEDULED → PREP_QUEUED → PREP_READY, with
        PREP_FAILED) is Pipeline 1. Live states (LIVE_IN_PROGRESS, COMPLETED,
        ABORTED_TECHNICAL) are Pipeline 2 — a PREP_READY session transitions to
        LIVE_IN_PROGRESS on go-live, then to COMPLETED or ABORTED_TECHNICAL.
      enum:
        - SCHEDULED
        - PREP_QUEUED
        - PREP_READY
        - PREP_FAILED
        - LIVE_IN_PROGRESS
        - COMPLETED
        - ABORTED_TECHNICAL
        - CANCELLED

    CreateInterviewSessionRequest:
      type: object
      required: [scheduledAt, timezone]
      properties:
        jobDescriptionId:
          type: string
          format: uuid
          nullable: true
          description: Required for ad-hoc bookings; omitted for a loop round, including JD-independent custom practice.
        roundType:
          allOf:
            - $ref: "#/components/schemas/RoundType"
          description: >
            Optional and normally omitted — the candidate does not pick the round. The backend
            assigns it (currently the first round; per-candidate round progression later). Accepted
            if sent (e.g. by the admin bench).
        scheduledAt:
          type: string
          format: date-time
          description: The chosen slot, as an absolute instant (UTC ISO-8601).
        timezone:
          type: string
          description: IANA timezone the candidate booked in (e.g. Asia/Kolkata).
          example: Asia/Kolkata
        loopId:
          type: string
          format: uuid
          nullable: true
          description: Book a round of this confirmed loop. Sent together with nodeId; the loop fixes the JD and the node fixes the round.
        nodeId:
          type: string
          nullable: true
          description: The loop graph node (round) being booked. The round must be unlocked.

    InterviewSession:
      type: object
      description: >
        A booked interview session and its blueprint prep. Only `prep` (progress) and `briefing`
        (interviewer, format, duration) reach the candidate: blueprint CONTENTS — problems, topics,
        difficulty, answer keys — are the interviewer's material and are never returned here.
      required:
        - id
        - candidateId
        - jobDescriptionId
        - company
        - role
        - level
        - specialization
        - roundType
        - scheduledAt
        - timezone
        - status
        - prep
        - briefing
        - liveAvailable
        - endReason
        - roundMinutes
        - passMark
        - score
        - outcome
        - verdict
        - retakeAfter
        - evaluationStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        jobDescriptionId:
          type: string
          format: uuid
          nullable: true
        company:
          type: string
          description: Company slug.
        companyName:
          type: string
          nullable: true
          description: Human-readable company name, when known.
        role:
          type: string
        level:
          $ref: "#/components/schemas/NullableEngineeringLevel"
        legacyLevel: { type: string, nullable: true, description: Unknown historic label retained for display/repair; not a selectable level. }
        specialization:
          type: string
        roundType:
          $ref: "#/components/schemas/RoundType"
        scheduledAt:
          type: string
          format: date-time
        timezone:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        prep:
          $ref: "#/components/schemas/SessionPrep"
        briefing:
          allOf: [{ $ref: "#/components/schemas/SessionBriefing" }]
          nullable: true
          description: Set once the blueprint is ready (and while it refreshes).
        liveAvailable:
          type: boolean
          description: False until the live interviewer is available; a ready session can't be joined yet.
        endReason:
          allOf: [{ $ref: "#/components/schemas/LiveEndReason" }]
          nullable: true
          description: How the live round ended; null before it ends.
        loopId:
          type: string
          format: uuid
          nullable: true
          description: The loop this session is a round of; null for ad-hoc bookings.
        nodeId:
          type: string
          nullable: true
        roundMinutes:
          type: integer
          enum: [30, 35, 40, 45]
          description: This round's length in minutes, drawn at booking and kept through reschedules; 45 for sessions booked before the draw.
        passMark: { type: number, nullable: true, description: "The round's pass mark (1-10), snapshotted at booking; null for sessions booked before grading." }
        score: { type: number, nullable: true, description: "Overall round score (1.0-10.0, one decimal); null until graded or when the round could not be scored." }
        outcome: { allOf: [{ $ref: "#/components/schemas/RoundOutcome" }], nullable: true }
        verdict: { type: string, nullable: true }
        retakeAfter: { type: string, format: date-time, nullable: true, description: Earliest retake after a below-pass round (the cooldown); null otherwise. }
        evaluationStatus:
          type: string
          enum: [evaluating, ready, failed, legacy]
          nullable: true
          description: Grading state of a completed round; null before the round completes. `legacy` rounds finished before grading existed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RoundReport:
      type: object
      description: >
        The graded debrief of a completed round. `status` is `evaluating` / `failed` / `legacy` with no other fields, or
        `ready` with the report. A `ready` report whose `outcome` is `unscorable` carries only `outcome`,
        `unscorableReason`, `meta`, `transcript` and `disputes`; every scored section is empty or null. The transcript is
        spoken text only, never interviewer orders, tool calls or briefs.
      required: [status]
      properties:
        status: { type: string, enum: [evaluating, failed, legacy, ready] }
        version: { type: integer, description: Report version; a dispute re-check stores a new one. }
        meta:
          type: object
          properties:
            company: { type: string, nullable: true }
            role: { type: string, nullable: true }
            level: { type: string, nullable: true }
            round: { type: string, nullable: true }
            roundMinutes: { type: integer, nullable: true }
            minutesPlayed: { type: number, nullable: true }
            codeStandard: { type: string, nullable: true, enum: [runnable, near_runnable, pseudo_ok] }
            weightsVersion: { type: string, nullable: true }
            evalVersion: { type: string, nullable: true }
        outcome: { allOf: [{ $ref: "#/components/schemas/RoundOutcome" }], nullable: true }
        unscorableReason: { type: string, nullable: true }
        score: { type: number, nullable: true }
        passMark: { type: number, nullable: true }
        verdict: { type: string, nullable: true }
        cap: { type: string, nullable: true, description: Reason the score was capped; null when it was not. }
        baseScore: { type: number, nullable: true, description: "The weighted area score before adjustments (1-10, one decimal); null when not scored." }
        bonusTotal: { type: number, nullable: true, description: "Sum of the positive adjustments after the +0.5 cap; null when not scored." }
        penaltyTotal: { type: number, nullable: true, description: "Sum of the negative adjustments (zero or below; no limit); null when not scored." }
        practicalScore: { type: number, nullable: true }
        theoryScore: { type: number, nullable: true }
        retakeAfter: { type: string, format: date-time, nullable: true }
        nextRound:
          type: object
          nullable: true
          description: The round this pass unlocked.
          required: [nodeId, name]
          properties:
            nodeId: { type: string }
            name: { type: string }
            type: { type: string, nullable: true }
        readiness: { allOf: [{ $ref: "#/components/schemas/ReadinessLevel" }], nullable: true, description: Readiness for the JD after this round; null when the loop does not count. }
        areas:
          type: array
          items:
            type: object
            required: [key, label, weight, score, reason, evidence]
            properties:
              key: { type: string }
              label: { type: string }
              weight: { type: number, description: Percent of the round this area is worth. }
              score: { type: number }
              reason: { type: string }
              evidence: { type: array, items: { type: string } }
              previousScore: { type: number, nullable: true, description: The same area on the previous attempt of this round. }
        adjustments:
          type: array
          items:
            type: object
            required: [kind, label, delta, note]
            properties:
              kind: { type: string }
              label: { type: string }
              delta: { type: number }
              turnId: { type: integer, nullable: true }
              at: { type: string, nullable: true }
              note: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, part, kind, asked, answerQuotes, verdict, score, strongAnswer, gap, topics]
            properties:
              id: { type: string }
              part: { type: string }
              kind: { type: string }
              title: { type: string, nullable: true }
              asked: { type: string }
              answerQuotes:
                type: array
                items:
                  type: object
                  required: [turnId, text]
                  properties: { turnId: { type: integer }, text: { type: string } }
              verdict: { type: string, enum: [correct, mostly, partly, wrong, not_answered, not_reached] }
              score: { type: number, nullable: true }
              strongAnswer: { type: string }
              gap: { type: string }
              topics:
                type: array
                items:
                  type: object
                  required: [subject, topic]
                  properties: { subject: { type: string }, topic: { type: string } }
              resumeConsistency: { type: string, nullable: true, enum: [consistent, unsupported, contradicts, n/a] }
              resumeNote: { type: string, nullable: true }
              origin: { type: string, enum: [asked, candidate_led] }
              intent: { type: string }
              code:
                type: object
                properties:
                  language: { type: string }
                  text: { type: string }
                  trace:
                    type: array
                    items:
                      type: object
                      properties: { example: { type: string }, predicted: { type: string }, expected: { type: string }, matches: { type: boolean } }
                  logicWorks: { type: string, enum: [yes, syntax_only, partly, "no"] }
                  syntaxSlips: { type: array, items: { type: string } }
              board:
                type: object
                properties:
                  summary: { type: string }
                  notes: { type: array, items: { type: string } }
                  scene: { type: object, nullable: true, additionalProperties: true, description: The final whiteboard scene (Excalidraw JSON). }
        delivery:
          type: object
          properties:
            observations:
              type: array
              items:
                type: object
                properties: { text: { type: string }, examples: { type: array, items: { type: integer }, description: Transcript turn ids. } }
            stats:
              type: object
              properties:
                medianAnswerLatencyS: { type: number, nullable: true }
                slowStarts: { type: integer, nullable: true, description: How many answers took 6 s or more to start. }
                fillers: { type: object, additionalProperties: { type: integer } }
                longSilences: { type: integer, nullable: true, description: How many silences over 90 s while coding. }
                selfCorrections: { type: integer, nullable: true }
        conduct:
          type: array
          items: { $ref: "#/components/schemas/RoundReportEvent" }
        integrity:
          type: array
          items: { $ref: "#/components/schemas/RoundReportEvent" }
        focus:
          type: array
          items:
            type: object
            required: [title, why, moments]
            properties:
              title: { type: string }
              why: { type: string }
              exampleQuote: { type: string, description: The candidate's own words from this round, shown apart from the advice. }
              exampleNote: { type: string, description: A coach's note on the quote. }
              moments: { type: array, items: { type: integer }, description: Transcript turn ids. }
        topicGaps:
          type: array
          items:
            type: object
            required: [subject, topics]
            properties:
              subject: { type: string }
              topics:
                type: array
                items:
                  type: object
                  required: [topic, why, practice]
                  properties:
                    topic: { type: string }
                    why: { type: string }
                    practice:
                      type: array
                      items:
                        type: object
                        required: [slug, title]
                        properties: { slug: { type: string }, title: { type: string }, difficulty: { type: string, nullable: true }, retry: { type: boolean } }
        strengths: { type: array, items: { type: string } }
        summary: { type: string }
        endQuestions:
          type: object
          properties:
            quality: { type: string, enum: [none, basic, thoughtful] }
            bonus: { type: number }
            note: { type: string }
        transcript:
          type: array
          items:
            type: object
            required: [turnId, speaker, text, markers, cutOff]
            properties:
              turnId: { type: integer }
              speaker: { type: string }
              text: { type: string }
              at: { type: string, nullable: true }
              cutOff: { type: boolean }
              markers:
                type: array
                items:
                  type: object
                  properties: { kind: { type: string }, note: { type: string } }
        disputes:
          type: array
          items:
            type: object
            properties:
              target:
                type: object
                properties: { type: { type: string, enum: [question, area] }, id: { type: string } }
              reason: { type: string }
              decision: { type: string, enum: [upheld, revised] }
              oldScore: { type: number, nullable: true }
              newScore: { type: number, nullable: true }
              explanation: { type: string }
              reportVersion: { type: integer, nullable: true }
              createdAt: { type: string, nullable: true }
        recheckPending:
          type: boolean
          description: A dispute re-check of this report is running; its decision appears in `disputes` when it completes.
        recheckTarget:
          type: object
          nullable: true
          description: The question or area being re-checked, while `recheckPending`; null otherwise or when not known.
          required: [type, id]
          properties:
            type: { type: string, enum: [question, area] }
            id: { type: string }
    RoundReportEvent:
      type: object
      required: [kind, effect]
      properties:
        kind: { type: string }
        at: { type: string, nullable: true }
        turnId: { type: integer, nullable: true }
        effect: { description: A score change, or the text "automatic fail". }
    CreateReportDisputeRequest:
      type: object
      required: [target, reason]
      properties:
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [question, area] }
            id: { type: string, description: A question id or an area key from the report. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReportDisputeStarted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [rechecking] }
    EvaluationRunError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        transient: { type: boolean }
    EvaluationRunSummary:
      type: object
      description: One evaluation run row (snake-case passthrough; the list leaves out request, raw and arithmetic).
      required: [run_id, trigger, status, created_at]
      properties:
        run_id: { type: string }
        session_id: { type: string, nullable: true }
        candidate_id: { type: string, nullable: true }
        trigger: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        company: { type: string, nullable: true }
        role: { type: string, nullable: true }
        level: { type: string, nullable: true }
        round_type: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        duration_ms: { type: integer, nullable: true }
        eval_version: { type: string, nullable: true }
        error: { allOf: [{ $ref: "#/components/schemas/EvaluationRunError" }], nullable: true }
        created_at: { type: string }
        ended_at: { type: string, nullable: true }
    EvaluationRunList:
      type: object
      required: [runs, next_cursor]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/EvaluationRunSummary" } }
        next_cursor: { type: string, nullable: true }
    EvaluationPartGrade:
      type: object
      description: One grader's structured output for one part. Free-form beyond the fields the admin view reads.
      required: [part_id]
      additionalProperties: true
      properties:
        part_id: { type: string }
        must_have_met: { type: boolean }
        areas:
          type: array
          items:
            type: object
            required: [key, score]
            additionalProperties: true
            properties:
              key: { type: string }
              score: { type: number }
              reason: { type: string }
              evidence: { type: array, items: { type: string } }
        questions:
          type: array
          items:
            type: object
            required: [id, score]
            additionalProperties: true
            properties:
              id: { type: string }
              asked: { type: string }
              verdict: { type: string }
              score: { type: number }
              gap: { type: string }
              resume_consistency: { type: string }
        code:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            logic_works: { type: string }
            actual_complexity: { type: string }
            syntax_slips: { type: array, items: { type: string } }
        moments:
          type: array
          items: { type: object, additionalProperties: true }
    EvaluationDisagreement:
      type: object
      description: A score gap or categorical disagreement between graders A and B; c is the tiebreak, merged the final value.
      required: [part_id, field]
      properties:
        part_id: { type: string }
        field: { type: string }
        a: { nullable: true }
        b: { nullable: true }
        c: { nullable: true }
        merged: { nullable: true }
    EvaluationRaw:
      type: object
      required: [disagreements, graders]
      properties:
        disagreements: { type: array, items: { $ref: "#/components/schemas/EvaluationDisagreement" } }
        graders:
          type: object
          description: Part id to grader outputs (A, B, and C when it tiebroke).
          additionalProperties:
            type: object
            properties:
              A: { $ref: "#/components/schemas/EvaluationPartGrade" }
              B: { $ref: "#/components/schemas/EvaluationPartGrade" }
              C: { $ref: "#/components/schemas/EvaluationPartGrade" }
    EvaluationArithmetic:
      type: object
      description: The final score arithmetic of a run.
      properties:
        pass_mark: { type: number }
        main_family: { type: string, nullable: true }
        auto_fail: { type: boolean }
        auto_fail_reason: { type: string, nullable: true }
        parts: { type: array, items: { type: object, additionalProperties: true } }
        adjustments: { type: array, items: { type: object, additionalProperties: true } }
        base: { type: number }
        bonus_total: { type: number }
        penalty_total: { type: number }
        cap: { nullable: true }
        score: { type: number, nullable: true }
        verdict: { type: string, nullable: true }
    EvaluationRunDetail:
      description: One run with raw grader outputs, disagreements, tiebreaks and arithmetic (snake-case passthrough).
      allOf:
        - $ref: "#/components/schemas/EvaluationRunSummary"
        - type: object
          properties:
            request: { type: object, nullable: true, additionalProperties: true }
            result:
              type: object
              nullable: true
              properties:
                version: { type: integer }
                outcome: { type: string }
                score: { type: number, nullable: true }
                verdict: { type: string, nullable: true }
                pass_mark: { type: number }
            raw: { allOf: [{ $ref: "#/components/schemas/EvaluationRaw" }], nullable: true }
            arithmetic: { allOf: [{ $ref: "#/components/schemas/EvaluationArithmetic" }], nullable: true }
    EvaluationRerunStarted:
      type: object
      required: [runId]
      properties:
        runId: { type: string }

    RescheduleInterviewSessionRequest:
      type: object
      required: [scheduledAt, timezone]
      properties:
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string }

    ProcessRoundNode:
      type: object
      required: [id, kind, type, name, durationMinutes, difficulty, topics, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [round] }
        type: { $ref: "#/components/schemas/RoundType" }
        name: { type: string }
        durationMinutes: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        topics: { type: array, items: { type: string } }
        instructions: { type: string, maxLength: 4000 }
        position: { $ref: "#/components/schemas/ProcessPosition" }
    ProcessInfoNode:
      type: object
      description: "A non-interview step (online test, take-home). Display only, never connected, scheduled, scored or counted."
      required: [id, kind, name, note, position]
      properties:
        id: { type: string }
        kind: { type: string, enum: [info] }
        name: { type: string }
        note: { type: string }
        topics: { type: array, items: { type: string, maxLength: 80 }, maxItems: 20 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        instructions: { type: string, maxLength: 4000 }
        position: { $ref: "#/components/schemas/ProcessPosition" }
    ProcessPosition:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }
    ProcessGraph:
      type: object
      description: >
        An interview process as a graph. Round nodes are ordered by edges (a round unlocks once every round
        feeding into it is completed). No cycles; round nodes form one connected graph.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ProcessRoundNode"
              - $ref: "#/components/schemas/ProcessInfoNode"
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties: { source: { type: string }, target: { type: string } }
    JdBrief:
      type: object
      required: [jdId, title, company, companyName, role, level, specialization, techStack, practiceTemplate]
      properties:
        jdId: { type: string, format: uuid }
        practiceTemplate: { type: boolean }
        title: { type: string }
        company: { type: string }
        companyName: { type: string }
        role: { type: string }
        level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        legacyLevel: { type: string, nullable: true }
        specialization: { type: string, nullable: true }
        techStack: { type: array, items: { type: string } }
    InterviewProcess:
      type: object
      required: [id, name, level, jd, graph, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        legacyLevel: { type: string, nullable: true }
        jd: { allOf: [{ $ref: "#/components/schemas/JdBrief" }], nullable: true }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InterviewProcessList:
      type: object
      required: [processes]
      properties:
        processes: { type: array, items: { $ref: "#/components/schemas/InterviewProcess" } }
    SaveProcessRequest:
      type: object
      description: Create with name and canonical engineering level; optional jdId copies its suggested graph. Without jdId a coding round is supplied if graph is omitted. Update accepts name, level and/or graph. Unknown historic levels must be explicitly repaired before copying or confirming. Every saved process is custom.
      properties:
        jdId: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 120 }
        level: { $ref: "#/components/schemas/EngineeringLevel" }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
    OfficialProcess:
      type: object
      required: [graph]
      properties:
        graph: { $ref: "#/components/schemas/ProcessGraph" }
    LoopNodeState:
      type: string
      description: "locked: earlier rounds unpassed. available: can be booked. booked: an attempt is scheduled or live. evaluating: the last attempt is being graded. passed: cleared. cooldown: below pass, retake after `retakeAfter`. completed: a legacy round finished before grading (counts as passed)."
      enum: [locked, available, booked, evaluating, passed, cooldown, completed]
    ReadinessLevel:
      type: string
      description: Mock-interview readiness for a JD, from the rounds of the unedited loop passed. Never a badge or an endorsement.
      enum: [getting_started, progressing, nearly_ready, interview_ready]
    RoundOutcome:
      type: string
      enum: [passed, below_pass, auto_fail, unscorable]
    Loop:
      type: object
      description: A confirmed process with optional JD. Graph, name and level are snapshots taken at confirm time. Custom and simulated template loops never count toward readiness.
      required: [id, name, level, jdId, jd, processId, kind, status, countsTowardReadiness, readiness, confirmedAt, graph, nodeStates, nodeResults, progress, sessions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        legacyLevel: { type: string, nullable: true }
        jdId: { type: string, format: uuid, nullable: true }
        jd: { allOf: [{ $ref: "#/components/schemas/JdBrief" }], nullable: true }
        processId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [official, standalone] }
        status: { type: string, enum: [active, paused, abandoned, completed] }
        countsTowardReadiness: { type: boolean, description: "Only unedited, suggested processes count." }
        readiness: { allOf: [{ $ref: "#/components/schemas/ReadinessLevel" }], nullable: true, description: Null when the loop does not count toward readiness. }
        confirmedAt: { type: string, format: date-time }
        graph: { $ref: "#/components/schemas/ProcessGraph" }
        nodeStates: { type: object, additionalProperties: { $ref: "#/components/schemas/LoopNodeState" } }
        nodeResults:
          type: object
          description: The latest finished attempt per round node.
          additionalProperties:
            type: object
            required: [sessionId, score, passMark, outcome, retakeAfter]
            properties:
              sessionId: { type: string, format: uuid }
              score: { type: number, nullable: true }
              passMark: { type: number, nullable: true }
              outcome: { allOf: [{ $ref: "#/components/schemas/RoundOutcome" }], nullable: true }
              retakeAfter: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          required: [total, completed, nextNodeIds]
          properties:
            total: { type: integer }
            completed: { type: integer }
            nextNodeIds: { type: array, items: { type: string } }
        sessions:
          type: array
          items:
            type: object
            required: [id, nodeId, status, scheduledAt, score, passMark, outcome, retakeAfter, evaluationStatus]
            properties:
              id: { type: string, format: uuid }
              nodeId: { type: string, nullable: true }
              status: { $ref: "#/components/schemas/SessionStatus" }
              scheduledAt: { type: string, format: date-time }
              score: { type: number, nullable: true }
              passMark: { type: number, nullable: true }
              outcome: { allOf: [{ $ref: "#/components/schemas/RoundOutcome" }], nullable: true }
              retakeAfter: { type: string, format: date-time, nullable: true }
              evaluationStatus: { type: string, enum: [evaluating, ready, failed, legacy], nullable: true }
    LoopList:
      type: object
      required: [loops]
      properties:
        loops: { type: array, items: { $ref: "#/components/schemas/Loop" } }
    ConfirmLoopRequest:
      type: object
      description: Provide jdId to confirm a suggested process, or processId to confirm a custom saved process. Explicit null jdId detaches a copied process from its source JD. Practice template JDs always produce standalone loops.
      properties:
        jdId: { type: string, format: uuid, nullable: true }
        processId: { type: string, format: uuid, nullable: true, description: "Omit to confirm the official process." }
    SetLoopStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, abandoned] }
    TargetList:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items:
            type: object
            required: [jd, addedAt, hasLiveLoop]
            properties:
              jd: { $ref: "#/components/schemas/JdBrief" }
              addedAt: { type: string, format: date-time }
              hasLiveLoop: { type: boolean }
    JdLoopStatus:
      type: object
      required: [targeted, loopId]
      properties:
        targeted: { type: boolean }
        loopId: { type: string, format: uuid, nullable: true }

    InterviewSessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/InterviewSession"

    WarmLiveResponse:
      type: object
      required: [warming]
      properties:
        warming:
          type: boolean
          description: True when an interviewer is in the room, on its way, or was just dispatched.
    LiveReadinessResponse:
      type: object
      required: [interviewer]
      properties:
        interviewer:
          type: string
          enum: [ready, waking]
          description: "`waking` while the AI service or its voice worker is not up yet."
    GoLiveResponse:
      type: object
      description: >
        Result of starting or checking the live interview. `livekitUrl`/`token`/`roomName`
        are populated while status == LIVE_IN_PROGRESS and null otherwise (e.g. before
        prep is ready, or after the session has COMPLETED/ABORTED_TECHNICAL).
      required: [status]
      properties:
        livekitUrl:
          type: string
          nullable: true
        token:
          type: string
          nullable: true
        roomName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SessionStatus"

    SessionPrep:
      type: object
      description: Blueprint prep progress. `steps` only while a run is active and readable.
      required: [step, steps, refreshing, preparedAt, errorCode]
      properties:
        step: { type: string, nullable: true, description: The run's current stage id. }
        steps:
          type: array
          items: { $ref: "#/components/schemas/PrepStep" }
        refreshing: { type: boolean, description: A refresh run is active; the current blueprint stays live. }
        preparedAt: { type: string, format: date-time, nullable: true }
        errorCode:
          type: string
          nullable: true
          description: "Set when status == PREP_FAILED: round_not_found | not_enough_problems | answer_key_failed | playbook_failed | llm_unavailable | validation_failed | timeout | cancelled | interrupted | internal_error."

    PrepStep:
      type: object
      required: [id, state, elapsedMs]
      properties:
        id: { $ref: "#/components/schemas/BlueprintStageId" }
        state: { type: string, enum: [done, active, pending, failed] }
        elapsedMs: { type: integer, nullable: true }

    LiveEndReason:
      type: string
      enum: [completed, ended_by_interviewer, candidate_ended, technical]
    LiveSummary:
      type: object
      properties:
        tab_changes: { type: integer, minimum: 0 }
        screen_changes_weighted: { type: number, minimum: 0 }
        full_violations: { type: integer, minimum: 0 }
        conduct_incidents: { type: integer, minimum: 0 }
        ended_at: { type: string }
        interviewer_note: { type: string }
    LiveEndRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/LiveEndReason" }
        live_summary: { $ref: "#/components/schemas/LiveSummary" }
    LiveEndResult:
      type: object
      required: [status, ended_reason, already_ended]
      properties:
        status: { $ref: "#/components/schemas/SessionStatus" }
        ended_reason: { type: string, nullable: true }
        already_ended: { type: boolean }
    CandidateLiveEndResult:
      type: object
      required: [status, endReason, alreadyEnded]
      properties:
        status: { $ref: "#/components/schemas/SessionStatus" }
        endReason: { type: string, nullable: true }
        alreadyEnded: { type: boolean }
    LiveContext:
      type: object
      description: What the interviewer worker needs at the start of a live round. No contact details.
      required: [session_id, candidate_id, first_name, status, round, profile]
      properties:
        session_id: { type: string, format: uuid }
        candidate_id: { type: string, format: uuid }
        first_name: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/SessionStatus" }
        round:
          type: object
          required: [company, company_name, role, level, round_type, duration_mins]
          properties:
            company: { type: string }
            company_name: { type: string, nullable: true }
            role: { type: string }
            level: { type: string }
            round_type: { $ref: "#/components/schemas/RoundType" }
            duration_mins: { type: integer }
        profile:
          type: object
          required: [headline, skills, projects]
          properties:
            headline: { type: string, nullable: true }
            skills: { type: array, items: { type: string } }
            projects: { type: array, items: { type: string } }
    SessionBriefing:
      type: object
      description: The only candidate-visible part of a blueprint. Never topics, problems or difficulty.
      required: [interviewerName, interviewerStyle, format, durationMins]
      properties:
        interviewerName: { type: string }
        interviewerStyle: { type: string }
        format: { type: string, description: 'e.g. "45-minute coding interview with a shared editor"' }
        durationMins: { type: integer }

    # ------- Blueprint (snake_case, ai-service owned; admin diagnostics + internal) ------- #
    BlueprintStageId:
      type: string
      enum: [context, selection, answer_keys, persona, personalization, playbooks, policies, validate]

    BlueprintTrigger:
      type: string
      enum: [booking, reconcile, refresh, retry, bench]

    BlueprintRunStatus:
      type: string
      enum: [running, completed, failed, cancelled]

    BlueprintRunRequest:
      type: object
      description: Everything a run needs, assembled by interviewiq-api. The candidate profile is a minimal projection (no contact details).
      required: [session, job_description, round, candidate_profile, exclusions, trigger, options, input_hash, input_parts]
      properties:
        session:
          type: object
          required: [session_id, candidate_id, company, role, level, round_type]
          properties:
            session_id: { type: string, nullable: true, description: Null for bench runs. }
            candidate_id: { type: string }
            candidate_label: { type: string, nullable: true }
            company: { type: string }
            role: { type: string }
            level: { type: string, description: The booked JD level label (may be a legacy alias). }
            specialization: { type: string, nullable: true }
            round_type: { $ref: "#/components/schemas/RoundType" }
            scheduled_at: { type: string, nullable: true }
            loop_id: { type: string, nullable: true }
            node_id: { type: string, nullable: true }
        job_description:
          type: object
          required: [title]
          properties:
            id: { type: string, nullable: true }
            title: { type: string }
            description: { type: string, nullable: true }
            tech_stack: { type: string, nullable: true }
        round:
          allOf: [{ $ref: "#/components/schemas/BlueprintRound" }]
          nullable: true
          description: Null when the brief/snapshot has no such round (the run fails with round_not_found).
        company_brief:
          type: object
          nullable: true
          properties:
            dominant_topics: { type: array, items: { type: string } }
            difficulty_calibration: { type: string, nullable: true }
            interviewer_style_notes: { type: string, nullable: true }
            company_specific_patterns: { type: string, nullable: true }
            red_flags: { type: array, items: { type: string } }
        candidate_profile: { type: object, additionalProperties: true }
        exclusions: { type: array, items: { type: string }, description: Bank slugs this candidate must not get again. }
        trigger: { $ref: "#/components/schemas/BlueprintTrigger" }
        options:
          type: object
          properties:
            bypass_blueprint_cache: { type: boolean }
            bypass_answer_key_cache: { type: boolean }
            ignore_exclusions: { type: boolean }
        input_hash: { type: string }
        input_parts: { type: object, additionalProperties: { type: string } }

    BlueprintRound:
      type: object
      required: [type, topics, problems, source]
      properties:
        type: { $ref: "#/components/schemas/RoundType" }
        name: { type: string, nullable: true }
        duration_mins: { type: integer, nullable: true }
        format: { type: string, nullable: true }
        topics: { type: array, items: { type: string } }
        problems: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [easy, medium, hard], nullable: true }
        source: { type: string, enum: [brief, practice] }

    BlueprintRunStarted:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [running] }
        existing: { type: boolean }

    BlueprintRunStatusView:
      type: object
      required: [run_id, status, steps]
      properties:
        run_id: { type: string }
        session_id: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BlueprintRunStatus" }
        stage: { allOf: [{ $ref: "#/components/schemas/BlueprintStageId" }], nullable: true }
        steps:
          type: array
          items:
            type: object
            required: [id, state]
            properties:
              id: { $ref: "#/components/schemas/BlueprintStageId" }
              state: { type: string, enum: [done, active, pending, failed] }
              elapsed_ms: { type: integer, nullable: true }
        error: { allOf: [{ $ref: "#/components/schemas/BlueprintRunError" }], nullable: true }
        blueprint_version: { type: integer, nullable: true }
        cached: { type: boolean }
        input_hash: { type: string, nullable: true }
        briefing: { allOf: [{ $ref: "#/components/schemas/BlueprintBriefing" }], nullable: true }

    BlueprintRunError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        stage: { type: string, nullable: true }

    BlueprintRunSummary:
      type: object
      required: [run_id, status, trigger, company, role, level, round_type, created_at]
      properties:
        run_id: { type: string }
        session_id: { type: string, nullable: true }
        candidate_id: { type: string }
        candidate_label: { type: string, nullable: true }
        trigger: { $ref: "#/components/schemas/BlueprintTrigger" }
        status: { $ref: "#/components/schemas/BlueprintRunStatus" }
        stage: { type: string, nullable: true }
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              state: { type: string }
              elapsed_ms: { type: integer, nullable: true }
        company: { type: string }
        role: { type: string }
        level: { type: string }
        round_type: { $ref: "#/components/schemas/RoundType" }
        error: { allOf: [{ $ref: "#/components/schemas/BlueprintRunError" }], nullable: true }
        blueprint_version: { type: integer, nullable: true }
        cached: { type: boolean }
        duration_ms: { type: integer, nullable: true }
        rerun_of: { type: string, nullable: true }
        created_at: { type: string }
        ended_at: { type: string, nullable: true }

    BlueprintRunList:
      type: object
      required: [runs, next_cursor]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/BlueprintRunSummary" } }
        next_cursor: { type: string, nullable: true }

    BlueprintLlmCall:
      type: object
      description: One LLM call (or sandbox check) recorded on a stage.
      properties:
        label: { type: string }
        attempt: { type: integer }
        system: { type: string }
        user: { type: string }
        raw: { type: string }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        latency_ms: { type: integer, nullable: true }
        attempts: { type: integer, nullable: true }
        tokens:
          type: object
          properties:
            prompt: { type: integer, nullable: true }
            completion: { type: integer, nullable: true }
        valid: { type: boolean }
        validation_errors: { type: array, items: { type: string } }
        sandbox: { type: boolean }
        error: { type: string }

    BlueprintStage:
      type: object
      required: [id, label, status]
      properties:
        id: { $ref: "#/components/schemas/BlueprintStageId" }
        label: { type: string }
        status: { type: string, enum: [pending, running, done, skipped, failed] }
        started_at: { type: string, nullable: true }
        ended_at: { type: string, nullable: true }
        duration_ms: { type: integer, nullable: true }
        summary: { type: object, additionalProperties: true }
        detail: { type: object, additionalProperties: true, description: Stage-specific detail (selection slots, answer keys, checks…). }
        llm_calls: { type: array, items: { $ref: "#/components/schemas/BlueprintLlmCall" } }
        error: { allOf: [{ $ref: "#/components/schemas/BlueprintRunError" }], nullable: true }

    BlueprintRunDetail:
      allOf:
        - $ref: "#/components/schemas/BlueprintRunSummary"
        - type: object
          required: [stages]
          properties:
            stages: { type: array, items: { $ref: "#/components/schemas/BlueprintStage" } }
            request: { $ref: "#/components/schemas/BlueprintRunRequest" }
            input_hash: { type: string }
            input_parts: { type: object, additionalProperties: { type: string } }
            blueprint: { allOf: [{ $ref: "#/components/schemas/Blueprint" }], nullable: true }
            briefing: { allOf: [{ $ref: "#/components/schemas/BlueprintBriefing" }], nullable: true }

    BlueprintBriefing:
      type: object
      required: [interviewer_name, interviewer_style, format, duration_mins]
      properties:
        interviewer_name: { type: string }
        interviewer_style: { type: string }
        format: { type: string }
        duration_mins: { type: integer }

    BlueprintBranch:
      type: object
      required: [condition, action, say]
      properties:
        condition: { type: string, description: One of the fixed condition vocabulary (spec §8.1). }
        action: { type: string, description: One of the fixed action vocabulary (spec §8.2). }
        say: { type: string }
        notes: { type: string }

    BlueprintSlot:
      type: object
      required: [slot_id, kind, order, timebox_mins, problem, answer_key, ask, hint_ladder, branches, expectations, evaluation_signals]
      properties:
        slot_id: { type: string }
        kind: { type: string, enum: [core, reserve] }
        order: { type: integer }
        purpose: { type: string }
        timebox_mins: { type: integer }
        bonus: { type: boolean, description: "A problem the round's minutes do not hold (a short round's second): given only if the first went well and time allows." }
        problem:
          type: object
          required: [round_type, slug, title, content]
          properties:
            round_type: { type: string }
            slug: { type: string }
            title: { type: string }
            difficulty: { type: string, nullable: true }
            content_hash: { type: string, nullable: true }
            content: { type: object, additionalProperties: true }
        answer_key:
          type: object
          properties:
            key: { type: object, additionalProperties: true }
            key_version: { type: string }
            cache_hit: { type: boolean }
        ask:
          type: object
          required: [opening]
          properties:
            opening: { type: string }
            clarifications:
              type: array
              items: { type: object, properties: { question: { type: string }, answer: { type: string } } }
        hint_ladder:
          type: array
          items: { type: object, properties: { step: { type: integer }, hint: { type: string } } }
        branches: { type: array, items: { $ref: "#/components/schemas/BlueprintBranch" } }
        probes: { type: array, items: { type: string } }
        follow_ups: { type: array, items: { type: string } }
        expectations:
          type: object
          properties:
            must_show: { type: array, items: { type: string } }
            strong_signals: { type: array, items: { type: string } }
            weak_signals: { type: array, items: { type: string } }
        evaluation_signals:
          type: array
          items: { type: object, properties: { signal: { type: string }, observe: { type: string } } }

    Blueprint:
      type: object
      description: The interviewer's playbook for one session (spec §8). Admin/internal only; immutable per version.
      required: [blueprint_id, candidate_id, version, status, input_hash, run_id, created_at, round, persona, arc, personalization, slots, policies, evaluation, briefing, provenance]
      properties:
        blueprint_id: { type: string }
        session_id: { type: string, nullable: true }
        candidate_id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [current, superseded, bench] }
        input_hash: { type: string }
        input_parts: { type: object, additionalProperties: { type: string } }
        run_id: { type: string }
        created_at: { type: string }
        round: { type: object, additionalProperties: true }
        shape_id: { type: string, description: "The round shape chosen at prep (app/blueprint/shapes.py); old blueprints are classic." }
        persona:
          type: object
          properties:
            name: { type: string }
            seniority: { type: string }
            style: { type: string }
            disposition: { type: string }
            opening: { type: string }
            closing: { type: string }
            grounded_in: { type: array, items: { type: string } }
        arc:
          type: array
          items:
            type: object
            properties:
              phase: { type: string, enum: [greeting, small_talk, framing, candidate_intro, core, candidate_questions, wrap_up] }
              timebox_mins: { type: integer }
              scored: { type: boolean }
              style: { type: string, description: "The part's style within the shape (for example pointed_resume); empty for the classic style." }
              guidance: { type: string }
        personalization:
          type: object
          properties:
            rapport_hooks: { type: array, items: { type: object, properties: { line: { type: string }, source: { type: string } } } }
            resume_probes: { type: array, items: { type: object, properties: { prompt: { type: string }, grounded_in: { type: string }, what_it_tests: { type: string } } } }
            level_expectations: { type: string }
            round_questions:
              description: "Hiring-manager rounds: questions the round's own topics or notes call for that no bank slot covers (CS fundamentals through the candidate's projects, HR checks such as relocation). Asked in the deep-dive time."
              type: array
              items: { type: object, properties: { prompt: { type: string }, covers: { type: string }, what_it_tests: { type: string }, expected: { type: string } } }
        slots: { type: array, items: { $ref: "#/components/schemas/BlueprintSlot" } }
        policies:
          type: object
          properties:
            version: { type: string }
            requests: { type: array, items: { type: object, properties: { kind: { type: string }, decision: { type: string, enum: [comply, decline, partial] }, how: { type: string } } } }
            off_topic: { type: string }
            time_management: { type: string }
            integrity: { type: string }
            fallback: { type: string }
        evaluation:
          type: object
          properties:
            global_signals: { type: array, items: { type: object, properties: { signal: { type: string }, observe: { type: string } } } }
            note: { type: string }
        briefing: { $ref: "#/components/schemas/BlueprintBriefing" }
        provenance: { type: object, additionalProperties: true }

    BlueprintVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              status: { type: string }
              created_at: { type: string }
              run_id: { type: string }
              input_hash: { type: string }
              input_parts: { type: object, additionalProperties: { type: string } }

    BlueprintDiff:
      type: object
      required: [from_version, to_version, inputs_changed, problems_changed, persona_changed, changes, truncated]
      properties:
        from_version: { type: integer }
        to_version: { type: integer }
        inputs_changed: { type: array, items: { type: string } }
        problems_changed:
          type: object
          additionalProperties:
            type: object
            properties:
              from: { type: string, nullable: true }
              to: { type: string, nullable: true }
        persona_changed: { type: boolean }
        changes:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              from: {}
              to: {}
        truncated: { type: boolean }

    AnswerKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              key_id: { type: string }
              round_type: { type: string }
              slug: { type: string }
              content_hash: { type: string, nullable: true }
              key_version: { type: string }
              key: { type: object, additionalProperties: true }
              created_at: { type: string }

    BlueprintBenchCandidate:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }

    BlueprintBenchRequest:
      type: object
      required: [candidateId]
      properties:
        candidateId: { type: string, format: uuid }
        jobDescriptionId: { type: string, format: uuid, nullable: true }
        loopId: { type: string, format: uuid, nullable: true }
        nodeId: { type: string, nullable: true }
        roundType: { $ref: "#/components/schemas/RoundType" }
        options:
          type: object
          properties:
            bypassBlueprintCache: { type: boolean }
            bypassAnswerKeyCache: { type: boolean }
            ignoreExclusions: { type: boolean }

    CompanyResearchState:
      type: object
      required: [lastRunId, lastResearchedAt, lastStatus, latestDraftId, latestDraftStatus]
      properties:
        lastRunId: { type: string, nullable: true }
        lastResearchedAt: { type: string, format: date-time, nullable: true }
        lastStatus: { type: string, nullable: true, description: The company's item status in its latest run (ResearchItemStatus). }
        latestDraftId: { type: string, nullable: true }
        latestDraftStatus: { type: string, nullable: true, description: "pending_review | approved | rejected | superseded" }
        latestDraftCoverage:
          allOf: [{ $ref: "#/components/schemas/DraftCoverageSummary" }]
          nullable: true
          description: How many tracked research fields the latest draft fills; below total means partial research.
    JobDescriptionSummary:
      type: object
      required: [id, company, companyName, role, level, title, specialization, techStack, yoeMin, yoeMax, ctcMinLpa, ctcMaxLpa, dataConfidence, dataAvailability, practiceTemplate]
      properties:
        id: { type: string, format: uuid }
        practiceTemplate: { type: boolean }
        company: { type: string }
        companyName: { type: string }
        role: { type: string }
        level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        legacyLevel: { type: string, nullable: true }
        title: { type: string }
        specialization: { type: [string, 'null'] }
        techStack: { type: array, items: { type: string } }
        yoeMin: { type: [number, 'null'] }
        yoeMax: { type: [number, 'null'] }
        ctcMinLpa: { type: [number, 'null'] }
        ctcMaxLpa: { type: [number, 'null'] }
        dataConfidence: { type: [string, 'null'] }
        dataAvailability: { type: string, enum: [rich, available, limited, none] }
    QuestionContentStatus:
      type: string
      enum: [none, generated, verified, failed]
      description: "none = index only; generated = non-DSA content stored (no executable checks exist for these rounds); verified = DSA content built on a validated source's examples; failed = the last attempt did not pass its checks, so no content is stored. Content is never stored in any other state."
    QuestionRubricItem:
      type: object
      required: [criterion, weight, strong, weak]
      properties:
        criterion: { type: string }
        weight: { type: number }
        strong: { type: string }
        weak: { type: string }
    QuestionExample:
      type: object
      required: [args, expected, explanation]
      properties:
        args: { type: object, additionalProperties: true, description: Named arguments for the reference solution's entry point. }
        expected: { description: The value the entry point returns for those arguments. }
        explanation: { type: string }
    QuestionJudgeTest:
      type: object
      required: [args, expected]
      properties:
        args: { type: object, additionalProperties: true }
        expected: {}
    DsaContent:
      type: object
      required: [statement, input_format, output_format, constraints, examples, hints, follow_ups, what_it_tests, estimated_minutes]
      properties:
        statement: { type: string }
        input_format: { type: string }
        output_format: { type: string }
        constraints: { type: array, items: { type: string } }
        examples: { type: array, minItems: 2, items: { $ref: "#/components/schemas/QuestionExample" } }
        judge_tests: { type: array, items: { $ref: "#/components/schemas/QuestionJudgeTest" } }
        hints: { type: array, minItems: 3, items: { type: string }, description: Escalating, gentle to explicit. }
        follow_ups: { type: array, items: { type: string } }
        approaches:
          type: array
          items:
            type: object
            required: [name, idea, time_complexity, space_complexity]
            properties: { name: { type: string }, idea: { type: string }, time_complexity: { type: string }, space_complexity: { type: string } }
        reference_solution:
          type: [object, 'null']
          description: "Null for source-grounded problems; answers are built at round-preparation time and cached."
          required: [language, entry_point, code]
          properties: { language: { type: string, enum: [python] }, entry_point: { type: string }, code: { type: string } }
        answer_order_irrelevant: { type: boolean }
        edge_cases: { type: array, items: { type: string } }
        common_mistakes: { type: array, items: { type: string } }
        rubric: { type: array, items: { $ref: "#/components/schemas/QuestionRubricItem" } }
        patterns: { type: array, items: { type: string } }
        what_it_tests: { type: string }
        estimated_minutes: { type: integer }
    SystemDesignContent:
      type: object
      required: [prompt, clarifying_questions, functional_requirements, non_functional_requirements, scale_assumptions, expected_design, deep_dives, trade_offs, follow_ups, rubric, strong_answer_summary, what_it_tests, estimated_minutes]
      properties:
        prompt: { type: string }
        clarifying_questions: { type: array, items: { type: string } }
        functional_requirements: { type: array, items: { type: string } }
        non_functional_requirements: { type: array, items: { type: string } }
        scale_assumptions: { type: array, items: { type: string } }
        expected_design:
          type: object
          required: [components, data_model, data_flow]
          properties:
            components: { type: array, items: { type: object, required: [name, purpose], properties: { name: { type: string }, purpose: { type: string } } } }
            data_model: { type: string }
            api_sketch: { type: array, items: { type: string } }
            data_flow: { type: string }
        deep_dives: { type: array, items: { type: string } }
        trade_offs: { type: array, items: { type: object, required: [decision, options, recommendation], properties: { decision: { type: string }, options: { type: array, items: { type: string } }, recommendation: { type: string } } } }
        follow_ups: { type: array, items: { type: string } }
        rubric: { type: array, items: { $ref: "#/components/schemas/QuestionRubricItem" } }
        red_flags: { type: array, items: { type: string } }
        strong_answer_summary: { type: string }
        what_it_tests: { type: string }
        estimated_minutes: { type: integer }
    LldContent:
      type: object
      required: [prompt, requirements, entities, expected_design, evaluation_mode, follow_ups, rubric, strong_answer_summary, what_it_tests, estimated_minutes]
      properties:
        prompt: { type: string }
        requirements: { type: array, items: { type: string } }
        entities: { type: array, items: { type: string } }
        expected_design:
          type: object
          required: [classes]
          properties:
            classes: { type: array, items: { type: object, required: [name, responsibilities], properties: { name: { type: string }, responsibilities: { type: string }, key_methods: { type: array, items: { type: string } } } } }
            relationships: { type: array, items: { type: string } }
            patterns: { type: array, items: { type: string } }
        sample_api: { type: array, items: { type: string } }
        evaluation_mode: { type: string, enum: [discussion, working-code] }
        follow_ups: { type: array, items: { type: string } }
        rubric: { type: array, items: { $ref: "#/components/schemas/QuestionRubricItem" } }
        red_flags: { type: array, items: { type: string } }
        strong_answer_summary: { type: string }
        what_it_tests: { type: string }
        estimated_minutes: { type: integer }
    BehaviouralContent:
      type: object
      required: [question, competency, what_it_tests, star_guide, strong_answer_summary, weak_answer_summary, follow_up_probes, estimated_minutes]
      properties:
        question: { type: string }
        competency: { type: string }
        what_it_tests: { type: string }
        star_guide:
          type: object
          required: [situation, task, action, result]
          properties: { situation: { type: string }, task: { type: string }, action: { type: string }, result: { type: string } }
        strong_answer_summary: { type: string }
        weak_answer_summary: { type: string }
        follow_up_probes: { type: array, items: { type: string } }
        red_flags: { type: array, items: { type: string } }
        principle: { type: [string, 'null'] }
        deep_dive_guidance: { type: [string, 'null'], description: Hiring-manager rounds only. }
        estimated_minutes: { type: integer }
    QuestionRecord:
      type: object
      required: [slug, round_type, title, url, sources, difficulty, topic_tags, company_tags, level_tags, enrichment_status, content_status]
      description: One problem-bank entry. The index fields come from the datasets and research briefs; `content` is our own text, generated from the index facts.
      properties:
        slug: { type: string }
        round_type: { type: string, enum: [dsa, online-assessment, system-design, lld, behavioural, hiring-manager] }
        title: { type: string }
        url: { type: string, description: Provenance only; empty for problems named in our research briefs. }
        sources: { type: array, items: { type: string } }
        difficulty: { type: [string, 'null'], enum: [easy, medium, hard, null] }
        topic_tags: { type: array, items: { type: string } }
        company_tags: { type: array, items: { type: string } }
        company_evidence: { type: object, additionalProperties: { type: string, enum: [reported, inferred] }, description: "Per company tag: reported by a dataset or brief, or inferred by the model." }
        level_tags: { type: array, items: { $ref: "#/components/schemas/EngineeringLevel" } }
        enrichment_status: { type: string, enum: [raw, enriched, enrich_failed] }
        content_status: { $ref: "#/components/schemas/QuestionContentStatus" }
        content_version: { type: [string, 'null'] }
        content_generated_at: { type: [string, 'null'] }
        content_model: { type: [string, 'null'] }
        content_error: { type: [string, 'null'] }
        content:
          description: Present with includeContent=true. Shape depends on round_type.
          oneOf:
            - $ref: "#/components/schemas/DsaContent"
            - $ref: "#/components/schemas/SystemDesignContent"
            - $ref: "#/components/schemas/LldContent"
            - $ref: "#/components/schemas/BehaviouralContent"
        acceptance_rate: { type: [number, 'null'] }
        frequency_score: { type: [number, 'null'] }
        is_premium: { type: [boolean, 'null'] }
        category: { type: [string, 'null'] }
        estimated_duration_mins: { type: [integer, 'null'] }
    QuestionBankPage:
      type: object
      required: [questions, count]
      properties:
        questions: { type: array, items: { $ref: "#/components/schemas/QuestionRecord" } }
        count: { type: integer, description: Total matching, ignoring the page limit. }
        returned: { type: integer }
    QuestionBankStats:
      type: object
      required: [rounds, total]
      properties:
        rounds:
          type: object
          description: "round_type -> content_status -> count"
