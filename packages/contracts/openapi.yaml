      type: object
      required: [run_id, status, already_running]
      properties:
        run_id: { type: string }
        status: { type: string }
        already_running: { type: boolean }
    JdFitLevelGap:
      type: string
      enum: [none, stretch, below, unknown]
      description: JD level vs the user's level. stretch = 2+ above (score capped), below = 2+ below, unknown = either level unset.
    JdFitResult:
      type: object
      required: [jdId, score, levelGap, cap, levelFactor]
      properties:
        jdId: { type: string, format: uuid }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null when the JD has nothing to match against. }
        levelGap: { $ref: "#/components/schemas/JdFitLevelGap" }
        cap: { type: [integer, 'null'], description: The stretch-role cap when levelGap is stretch. }
        levelFactor: { type: [number, 'null'], description: "Multiplier applied for a role below the user's level (0.85 one level below, 0.7 two or more); null otherwise." }
    JdFitList:
      type: object
      required: [configVersion, userLevel, results]
      properties:
        configVersion: { type: string }
        userLevel: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        results: { type: array, items: { $ref: "#/components/schemas/JdFitResult" } }
    JdFitEvidence:
      type: object
      required: [source, item, matched, tag]
      properties:
        source: { type: string, enum: [resume, github, leetcode, codeforces, tuf] }
        item: { type: string, description: "The project, role, repo or platform topic that matched." }
        matched: { type: string, description: "The word, entry or count that matched." }
        tag: { type: string, description: "What it matched in the JD: a skill, domain, role, topic or experience range." }
    JdFitPart:
      type: object
      required: [key, weight, value, status, evidence, uncovered, hint, reason]
      properties:
        key: { type: string, enum: [skills, domain, role, experience, round_topics] }
        weight: { type: number, description: Configured weight; dropped parts are left out and the rest rescale. }
        value: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [scored, missing, dropped], description: missing = the user has no source for it (counts 0); dropped = the JD has nothing to match against. }
        evidence: { type: array, items: { $ref: "#/components/schemas/JdFitEvidence" } }
        uncovered: { type: array, items: { type: string }, description: What the JD asks for that the profile doesn't show. }
        hint: { type: [string, 'null'], description: Set when missing. }
        reason: { type: [string, 'null'], description: Set when dropped. }
    JdFitBreakdown:
      type: object
      required: [jdId, score, levelGap, cap, levelFactor, userLevel, jdLevel, configVersion, parts]
      properties:
        jdId: { type: string, format: uuid }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        levelGap: { $ref: "#/components/schemas/JdFitLevelGap" }
        cap: { type: [integer, 'null'], description: The stretch-role cap when levelGap is stretch. }
        levelFactor: { type: [number, 'null'], description: "Multiplier applied for a role below the user's level (0.85 one level below, 0.7 two or more); null otherwise." }
        userLevel: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        jdLevel: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        configVersion: { type: string }
        parts: { type: array, items: { $ref: "#/components/schemas/JdFitPart" } }
    JobDescriptionDetail:
      type: object
      required: [id, company, companyName, role, level, title, specialization, description, techStack, sourceUrl, yoeMin, yoeMax, ctcMinLpa, ctcMaxLpa, dataConfidence, dataAvailability, interviewProcess, sources, practiceTemplate]
      properties:
        id: { type: string, format: uuid }
        practiceTemplate: { type: boolean, description: Simulated practice template, not a verified company process or hiring claim. }
        company: { type: string }
        companyName: { type: string }
        role: { type: string }
        level: { $ref: "#/components/schemas/NullableEngineeringLevel" }
        legacyLevel: { type: string, nullable: true }
        title: { type: string }
        specialization: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        techStack: { type: array, items: { type: string } }
        sourceUrl: { type: [string, 'null'] }
        yoeMin: { type: [number, 'null'] }
        yoeMax: { type: [number, 'null'] }
        ctcMinLpa: { type: [number, 'null'] }
        ctcMaxLpa: { type: [number, 'null'] }
        dataConfidence: { type: [string, 'null'] }
        dataAvailability: { type: string, enum: [rich, available, limited, none] }
        sources: { type: array, items: { type: string } }
        companyOverview:
          $ref: "#/components/schemas/EnrichmentCompany"
        interviewProcess:
          type: [object, 'null']
          additionalProperties: true
          description: Candidate-safe process. Verified manual rounds retain their explicit array order and source evidence.
          properties:
            rounds:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  round_number: { type: integer }
                  type: { type: string }
                  duration_minutes: { type: number }
                  difficulty: { type: string }
                  topics: { type: array, items: { type: string } }
                  problems: { type: array, items: { type: string } }
                  format: { type: string }
                  source_urls: { type: array, items: { type: string } }
    EnrichmentCompany:
      type: object
      additionalProperties: false
      required: [overview, culture, benefits, sourceUrls, verified]
      properties:
        overview: { type: string, maxLength: 10000 }
        culture: { type: string, maxLength: 10000 }
        benefits: { type: string, maxLength: 10000 }
        sourceUrls: { type: array, maxItems: 20, items: { type: string, format: uri, maxLength: 2048 } }
        verified: { type: boolean }
    EnrichmentRound:
      type: object
      additionalProperties: false
      required: [id, name, type, durationMinutes, difficulty, topics, questions, guidance, sourceUrls, verified]
