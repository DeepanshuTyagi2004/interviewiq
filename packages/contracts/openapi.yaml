openapi: 3.0.3

info:
  title: InterviewIQ Contract
  version: 0.5.0
  description: >
    Source-of-truth contract for the InterviewIQ service boundaries.

    Two boundaries live here:

    * **candidate** (`interviewiq-web` ↔ `interviewiq-api`, served at :8080) — the
      candidate-facing REST surface, JWT-authenticated. The frontend generates its
      TypeScript types from this file (`scripts/generate-types.ts` → openapi-typescript).
    * **internal** (`interviewiq-api` ↔ `interviewiq-ai-service`, served at :8000) —
      the service-to-service surface guarded by the `X-Internal-Api-Key` shared secret.

    Interview blueprint prep (docs/superpowers/specs/2026-10-07-interview-blueprint-design.md):
    a candidate books an interview session for a JD + round + slot, and the backend
    immediately asks the ai-service to prepare a `Blueprint` (problems chosen from the bank,
    persona, timed arc, per-question playbooks with condition → action branches, answer keys,
    policies, evaluation signals). The candidate only ever sees prep progress and a
    `SessionBriefing`; blueprints are admin diagnostics material and never sent to a candidate.
    The blueprint carries no scores and is never grafted onto the descriptive Profile Builder
    `ProfileSummary` contract.

    Email/password auth (register, login, email verification, password reset) and the
    `CurrentUser` shape are the surface added in 0.3.0.

    Company research (admin): curated companies, research runs with pause/resume/stop and a
    full-verbosity trace (spans + events) is the surface added in 0.4.0. Research payloads are the
    ai-service's snake_case JSON passed through by interviewiq-api; admin company payloads are camelCase.

servers:
  - url: http://localhost:8080
    description: interviewiq-api (candidate-facing, JWT)

tags:
  - name: auth
    description: >
      Backend-owned auth (api ↔ web). Google sign-in, email/password accounts, email
      verification, password reset, refresh-token rotation. Session = short-lived JWT access
      token (JSON body) + an httpOnly `refresh_token` cookie scoped to `/api/v1/auth`.
  - name: users
    description: The signed-in user.
  - name: interview-sessions
    description: Candidate-facing interview booking + blueprint prep status (api ↔ web).
  - name: internal-blueprints
    description: Service-to-service blueprint runs (api ↔ ai-service).
  - name: admin-blueprints
    description: Interview blueprint diagnostics (ADMIN only; snake_case passthrough of the ai-service).
  - name: admin-evaluations
    description: Round-evaluation diagnostics (ADMIN only; snake_case passthrough of the ai-service).
  - name: admin-companies
    description: Curated company catalogue the research job works through (ADMIN only).
  - name: admin-research
    description: Company research runs, controls and their full trace (ADMIN only; snake_case passthrough).
  - name: internal-research
    description: Service-to-service research targets (ai-service → api).
  - name: profile-scoring
    description: Provisional deterministic profile assessment, separate from interviews and descriptive synthesis.

paths:
  /api/v1/users/me/linkedin:
    get:
      operationId: getLinkedInImportStatus
      tags: [users]
      summary: Read the owner's confirmed LinkedIn snapshot status.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Imported snapshot or disconnected status; not live sync or verified employment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInImportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: disconnectLinkedInImport
      tags: [users]
      summary: Remove LinkedIn source evidence and drafts.
      description: Details explicitly merged into the editable profile remain editable there. Fences in-flight PDF extractions from silently reconnecting the source.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Source and drafts removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Another import action is in progress. }
  /api/v1/admin/validation-controls:
    get:
      operationId: getAdminValidationControls
      tags: [admin]
      summary: Read persisted LinkedIn import validation controls.
      description: ADMIN only. Defaults are safe and enabled. Settings affect new validation operations and do not recalculate existing scores.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current validation controls and audit metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationControlsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
    patch:
      operationId: patchAdminValidationControls
      tags: [admin]
      summary: Update one or more LinkedIn import validation controls.
      description: ADMIN only. Each supplied value is a boolean. Disabling LinkedIn import stops new PDF uploads before any extraction runs.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                linkedinImportEnabled: { type: boolean }
                requireSectionReview: { type: boolean }
      responses:
        "200":
          description: Persisted controls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationControlsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "415": { description: JSON is required. }
  /api/v1/intelligence/profile-scoring/live:
    post:
      operationId: inspectLiveProfileCalculation
      tags: [intelligence]
      summary: Run one user's profile scoring live and stream every step (NDJSON).
      description: >
        ADMIN only. Runs what the weekly batch runs for one user, streaming one ProfileLiveTraceEvent per line:
        reading stored sources, the AI-service item assessments (new or edited items; every item with
        forceReassess) and company-context lookups, the snapshot write, and the deterministic engine with every
        intermediate step. The last line is a `result` event (data = ProfileLiveTraceResponse) or an `error` event
        (data = { name, message, stack }). Source collectors are never called. Full detail is kept for admin
        debugging (names, contacts, employers, the stored profile and raw source data); credential-looking strings
        are scrubbed and the password hash is never included.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                forceReassess: { type: boolean, description: Re-send every resume item to the LLM even when unchanged. }
      responses:
        "200":
          description: NDJSON stream of trace events; a stage failure arrives as an `error` event, not an HTTP error.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/ProfileLiveTraceEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Admin role required. }
        "404": { description: User not found. }
  /api/v1/users/me/linkedin/imports:
    post:
      operationId: importLinkedInPdf
      tags: [users]
      summary: Import the owner's LinkedIn "Save to PDF" file for review.
      description: Consent declares ownership but does not verify it. The PDF is read once by the AI service and never stored; nothing is fetched from LinkedIn. Only files shaped like LinkedIn's Save to PDF export are accepted. Every claim must quote the PDF text. Does not publish evidence or change the profile before confirmation.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, consent]
              properties:
                file: { type: string, format: binary, description: The PDF from LinkedIn's Save to PDF (up to 5 MB). }
                consent: { type: string, enum: ["true"] }
      responses:
        "201":
          description: Private derived draft; review and confirm available sections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInImportDraft" }
        "400": { description: "File missing (linkedin_pdf_missing), consent absent (linkedin_consent_required) or malformed multipart (linkedin_import_invalid)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: User not found. }
        "409": { description: The import was cancelled by disconnecting LinkedIn, or another import action is busy. }
        "413": { description: The PDF is larger than 5 MB (linkedin_pdf_too_large). }
        "415": { description: Not multipart/form-data, or the file is not a PDF. }
        "422": { description: "Not LinkedIn's Save to PDF file (linkedin_pdf_unrecognized), no readable text (linkedin_pdf_unreadable) or no evidenced career claims (linkedin_pdf_no_claims)." }
        "429": { description: Owner already has three unexpired drafts. }
        "503": { description: "LinkedIn import disabled (linkedin_import_disabled), extractor unavailable (linkedin_extractor_unavailable) or storage unavailable." }
  /api/v1/users/me/linkedin/imports/{id}/confirm:
    post:
      operationId: confirmLinkedInProfileSections
      tags: [users]
      summary: Publish only reviewed sections, optionally merging into profile details.
      description: Source-only by default. Optional merge fills blanks and appends deduplicated rows without changing existing human choices or engineering level. Uses draft profile revision to reject stale merges. Identical successful confirmations reuse their receipt.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sections]
              properties:
                sections: { type: array, minItems: 1, maxItems: 13, items: { $ref: "#/components/schemas/LinkedInSectionKey" } }
                mergeProfile: { type: boolean, default: false }
      responses:
        "200":
          description: Confirmed source receipt and optional merged profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkedInImportConfirmation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Draft does not exist or belongs to another owner. }
        "409": { description: Profile changed, conflicting prior confirmation, or import action is busy. }
        "410": { description: Draft expired. Retrieve a new preview. }
        "415": { description: Only JSON confirmation is supported. }
        "503": { description: Storage could not save the confirmation. }
  /api/v1/users/me/candidate-profile:
    get:
      operationId: getCandidateProfile
      tags: [users]
      summary: Read saved profile details and the current engineering level.
      description: Known legacy labels normalize on read; unknown labels return null with legacyLevel metadata. Does not infer the current level from a target JD or rewrite saved identities.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Saved candidate profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfileResponse" }
        "204": { description: No saved profile yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: saveCandidateProfile
      tags: [users]
      summary: Save profile details and optional current engineering level.
      description: Omitted level preserves the previous choice. A supplied non-null level must be canonical. Drafts may have null; completing onboarding requires a supplied or previously saved recognized level.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateProfileRequest" }
      responses:
        "200":
          description: Saved profile; current level is separate from target JD level.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users/me/profile-score:
    get:
      operationId: getProfileScore
      tags: [profile-scoring]
      summary: Read the current beta profile assessment and frozen history.
      description: >
        Lazily caches a frozen assessment when local inputs, settings, privacy, methodology or UTC Monday
        week change. No provider requests. Repeated unchanged reads do not create history. Current ranks
        are live decorations; historical ranks are finalized once by the weekly generation.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current assessment, history and private scoring settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileScoreResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: recalculateProfileScore
      tags: [profile-scoring]
      summary: Recalculate the signed-in user's profile score; also re-runs the AI item assessment for new or changed items.
      description: >
        Starts the assessment in the background (unchanged items reuse their stored result) and returns at once with
        `assessment.inProgress`; poll the GET until it clears. Limited to 3 runs per user per rolling 7 days, enforced
        server-side (429 `profile_scoring_recalculation_limit`; `assessment.nextAvailableAt` says when the next frees up).
        A run that stored no new assessment is not charged. Idempotent for the same week, configuration and local
        input fingerprint. No interview result changes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Refreshed assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileScoreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/connections/platforms:
    get:
      operationId: listPlatformConnections
      tags: [connections]
      summary: The user's coding-platform connections (Codeforces, CodeChef, AtCoder, takeUforward).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Supported platforms and current connections.
          content:
            application/json:
              schema:
                type: object
                required: [supported, connections]
                properties:
                  supported: { type: array, items: { $ref: "#/components/schemas/CodingPlatform" } }
                  connections: { type: array, items: { $ref: "#/components/schemas/PlatformConnection" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/connections/platforms/{platform}:
    parameters:
      - { name: platform, in: path, required: true, schema: { $ref: "#/components/schemas/CodingPlatform" } }
    post:
      operationId: connectPlatform
      tags: [connections]
      summary: Connect a coding platform by public handle (or pasted profile URL).
      description: >
        Validates the handle against the platform's public data, then collects in the background (202, SYNCING;
        poll the profile). Re-connecting re-points the connection. A takeUforward import also connects the
        LeetCode/Codeforces/CodeChef/AtCoder profiles linked on TUF, only where the user has none.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string, maxLength: 200 }
      responses:
        "202":
          description: Connection accepted; collection runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConnection" }
        "400": { description: "platform_handle_invalid or platform_bad_request", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: platform_user_not_found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: platform_unreachable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: disconnectPlatform
      tags: [connections]
      summary: Disconnect a coding platform and delete its fragment. Idempotent.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Disconnected. }
        "400": { description: platform_bad_request (unknown platform), content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/users/me/profile-score/settings:
    patch:
      operationId: updateProfileScoringSettings
      tags: [profile-scoring]
      summary: Update the profile's engineering level or opt into the profile leaderboard.
      description: Legacy declaredLevel writes update CandidateProfile.level, not a separate scoring-only choice. Evidence assessment remains separate. Opt-in defaults false and privacy settings still apply.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                declaredLevel: { $ref: "#/components/schemas/NullableEngineeringLevel" }
                leaderboardOptIn: { type: boolean }
      responses:
        "200":
          description: Updated settings and assessment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileScoreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/profile-leaderboard:
    get:
      operationId: getProfileLeaderboard
      tags: [profile-scoring]
      summary: Same-level, current-week profile ranking with privacy-safe identities.
      description: >
        Includes only opted-in eligible users with unchanged current inputs and matching level, version and
        configuration hash. Ties share competition rank. Percentiles are null below the minimum cohort.
        No user IDs, emails, evidence or connected account handles are returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: level
          in: query
          schema: { type: string, enum: [intern, fresher, sde1, sde2, sde3, staff, principal, distinguished], default: sde1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Eligible same-level cohort, possibly empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileLeaderboardResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/intelligence/questions:
    get:
      tags: [intelligence]
      operationId: listQuestionBank
      summary: Read the problem bank (ADMIN). Thin index rows by default; includeContent=true adds each problem's content.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roundType, in: query, schema: { type: string, enum: [dsa, online-assessment, system-design, lld, behavioural, hiring-manager] } }
        - { name: company, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: string, enum: [easy, medium, hard] } }
        - { name: contentStatus, in: query, schema: { $ref: "#/components/schemas/QuestionContentStatus" } }
        - { name: topic, in: query, schema: { type: string }, description: Case-insensitive substring of a topic tag. }
        - { name: includeContent, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Matching problems., content: { application/json: { schema: { $ref: "#/components/schemas/QuestionBankPage" } } } }
  /api/v1/intelligence/questions/stats:
    get:
      tags: [intelligence]
      operationId: getQuestionBankStats
      summary: Counts per round type and content status (ADMIN).
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Counts., content: { application/json: { schema: { $ref: "#/components/schemas/QuestionBankStats" } } } }
  /api/v1/intelligence/questions/generate:
    post:
      tags: [intelligence]
      operationId: generateQuestionContent
      summary: Start content generation over the problem-bank index in the background (ADMIN). Progress via /intelligence/scrape/status.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: roundType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: Generate at most this many records (runs are resumable). }
        - { name: force, in: query, schema: { type: boolean }, description: Regenerate records whose content is current. }
      responses:
        "200": { description: Run accepted (or the run already in progress)., content: { application/json: { schema: { $ref: "#/components/schemas/QuestionGenerateResponse" } } } }
  /api/v1/intelligence/diagnostics:
    get:
      operationId: getProfileScoringDiagnostics
      tags: [profile-scoring]
      summary: ADMIN read-only local storage, methodology, replay and job diagnostics.
      description: >
        Without userId checks system scoring state; with userId also checks that user's frozen snapshot,
        source freshness, numerical bounds, weighted formula and historical rank constraints.
        Live collectors, interview preparation and voice remain explicitly untested. Never recalculates on read.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded checks and the current methodology.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileDiagnosticsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: ADMIN role required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an email/password account and sign in.
      description: >
        Public. The email is trimmed and lowercased; the name is trimmed. The new account is
        role USER (ADMIN for bootstrap admin emails), `onboardingComplete=false` and unverified;
        a verification link (`{FRONTEND_URL}/verify-email?token=…`) is emailed immediately.
        Signs the user in: returns the access token and sets the `refresh_token` cookie.
        Rate limited per client IP (10/hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          description: >
            The email is already registered. `email_taken` — an email/password account exists
            (log in instead). `use_google` — the email belongs to a Google account ("This email
            signs in with Google. Continue with Google instead.").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                email_taken:
                  value: { code: email_taken, message: An account with this email already exists. Log in instead. }
                use_google:
                  value: { code: use_google, message: This email signs in with Google. Continue with Google instead. }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email + password.
      description: >
        Public. The email is matched case-insensitively. An unverified email may still sign in.
        Wrong email, wrong password, and an account with no password (Google-only) all return
        the same 401 `invalid_credentials`. Rate limited per IP + email (10/15 min) and per IP
        (50/15 min).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid_credentials` — Incorrect email or password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example: { code: invalid_credentials, message: Incorrect email or password. }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm the email address with the token from the verification link.
      description: Public. Tokens are single-use and expire after 24 hours; only the newest link sent works.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: "#/components/responses/InvalidTokenOrRequest"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Email a fresh verification link to the signed-in user.
      description: >
        Requires the Bearer access token. A 204 no-op when the email is already verified.
        Supersedes any earlier verification link. Rate limited per user (5/hour).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Link sent (or nothing to do).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a password-reset link.
      description: >
        Public. Always 204, whether or not an account exists (no account enumeration). If one
        does — password or Google-only (resetting then adds a password) — a link to
        `{FRONTEND_URL}/reset-password?token=…` is emailed; it expires after 1 hour and only the
        newest one works. Rate limited per IP + email (5/hour).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the token from the reset link.
      description: >
        Public. Sets the new password, marks the email verified, consumes the token and signs the
        user out everywhere (every refresh token is revoked). Does NOT sign in — follow with
        `login`. A password that fails validation (400 `invalid_request`) does not use up the
        token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/InvalidTokenOrRequest"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the refresh cookie and get a new access token.
      description: >
        Public; reads the `refresh_token` cookie. Every call rotates the cookie (the presented
        token stops working). A missing, expired, revoked or reused token is a bare 401 (no body)
        and clears the cookie.
      security: []
      responses:
        "200":
          description: New access token; the rotated refresh cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "204":
          description: No session (the request carried no refresh cookie); empty body. The visitor is signed out.
        "401":
          description: No valid refresh token (empty body; the cookie is cleared).

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the refresh cookie's token and clear it.
      security: []
      responses:
        "204":
          description: Signed out.

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: The signed-in user (role + onboarding + verification flags gate the UI).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The token's user no longer exists (empty body).
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Change the display name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: "`invalid_name`."
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteAccount
      tags: [users]
      summary: Delete the account and everything it holds, immediately.
      description: >
        The user types their email to confirm; password accounts also send the password. Refused
        while an interview is live (`interview_in_progress`), when the AI service cannot purge the
        account's interview data (`deletion_unavailable`), or when the confirmation does not match
        (`confirmation_mismatch`). Shares the login rate limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Deleted; the refresh cookie is cleared.
        "400":
          description: "`invalid_request`, `confirmation_mismatch`."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`interview_in_progress`."
        "503":
          description: "`deletion_unavailable`."

  /api/v1/users/me/sessions/revoke:
    post:
      operationId: revokeAllSessions
      tags: [users]
      summary: Sign out of every device, this one included (all refresh tokens revoked).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked; the refresh cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/export:
    get:
      operationId: exportAccount
      tags: [users]
      summary: Everything the API holds about the account, as a JSON attachment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "The export (`Content-Disposition: attachment`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/preferences:
    get:
      operationId: getPreferences
      tags: [users]
      summary: Account-level settings, every value resolved (defaults overlaid with what the user changed).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updatePreferences
      tags: [users]
      summary: Change any subset of settings; unknown keys are rejected (`invalid_preferences`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatch"
      responses:
        "200":
          description: The full preferences after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          description: "`invalid_preferences`."
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ------------------------------------------------------------------ #
  # Candidate-facing (interviewiq-web ↔ interviewiq-api, JWT)           #
  # ------------------------------------------------------------------ #
  /api/v1/interviews/sessions:
    get:
      operationId: listMyInterviewSessions
      tags: [interview-sessions]
      summary: List the authenticated candidate's interview sessions (newest first).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The candidate's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInterviewSession
      tags: [interview-sessions]
      summary: Book an interview session for a JD + round + slot (status SCHEDULED).
      description: >
        Creates a session for the selected job description, round type, and slot. The
        JD must resolve to a real, enabled company/role/level (CompanyRoleConfig) and
        the round type must be a valid `RoundType`. Prep is scheduled automatically —
        the session starts as `SCHEDULED` and the backend generates the plan shortly
        before the slot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewSessionRequest"
      responses:
        "403": { description: "`interview_access_required` — the account has the USER role and cannot run interviews.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "201":
          description: The created session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/interviews/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getInterviewSession
      tags: [interview-sessions]
      summary: Get one interview session's status. Only the owning candidate may read it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interviews/sessions/{sessionId}/report:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getRoundReport
      tags: [interview-sessions]
      summary: The graded debrief of a completed round (only the owning candidate).
      description: Poll while `status` is `evaluating`. `failed` retries automatically; `legacy` rounds have no report.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The report, or just its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interviews/sessions/{sessionId}/report/disputes:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: disputeRoundReport
      tags: [interview-sessions]
      summary: Dispute one question or area of the report; a re-check never lowers the score.
      description: One per target, at most 3 per report, within 14 days of the first report.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportDisputeRequest"
      responses:
        "202":
          description: The re-check started; poll the report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDisputeStarted"
        "400": { description: "`invalid_dispute`" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409": { description: "`report_not_ready`, `dispute_window_closed`, `dispute_exists` or `dispute_limit`" }

  /api/v1/interviews/sessions/{sessionId}/prep/retry:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: retryInterviewSessionPrep
      tags: [interview-sessions]
      summary: Retry blueprint prep after PREP_FAILED.
      description: >
        Moves a PREP_FAILED session back to PREP_QUEUED and starts a new blueprint run. Limited
        to 3 retries per rolling hour per session (server-enforced). Only the owning candidate may call this.
      security:
        - bearerAuth: []
      responses:
        "403": { description: "`interview_access_required` — the account has the USER role and cannot run interviews.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "202":
          description: Retry accepted; the session is PREP_QUEUED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`prep_not_failed`: the session is not in PREP_FAILED."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "429":
          description: "`prep_retry_limited`: too many retries this hour; the message says when to try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/v1/interviews/sessions/{sessionId}/live:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: goLiveInterviewSession
      tags: [interview-sessions]
      summary: Start (or resume) the live interview; mints a LiveKit join token.
      description: >
        Moves a PREP_READY session to LIVE_IN_PROGRESS and mints a fresh LiveKit join
        token. Idempotent while already LIVE_IN_PROGRESS — returns a fresh token for
        the same room without altering session state. Only the owning candidate may
        call this. Refused with 409 `live_unavailable` while the live interviewer is unavailable to this user
        (`InterviewSession.liveAvailable` is false), and 409 `session_not_ready` unless PREP_READY.
        Going live marks the blueprint's problems as seen, so later blueprints never repeat them, and dispatches the interviewer agent into the room.
      security:
        - bearerAuth: []
      responses:
        "403": { description: "`interview_access_required` — the account has the USER role and cannot run interviews.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "200":
          description: The live session state, with a LiveKit join token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`live_unavailable` or `session_not_ready`."
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    get:
      operationId: getLiveInterviewSession
      tags: [interview-sessions]
      summary: Current live state (fresh token if LIVE_IN_PROGRESS).
      description: >
        Read-only check of the session's live state. Returns a fresh LiveKit token
        when LIVE_IN_PROGRESS; livekitUrl/token/roomName are null for any other
        status. Only the owning candidate may call this.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The live session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoLiveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jds:
    get:
      tags: [catalogue]
      operationId: listJobDescriptions
      summary: Published role summaries, including explicitly marked simulated practice templates.
      parameters:
        - { name: company, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: specialization, in: query, schema: { type: string } }
      responses:
        "200": { description: Published roles., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JobDescriptionSummary" } } } } }
  /api/v1/jds/{jdId}:
    get:
      tags: [catalogue]
      operationId: getJobDescription
      summary: Read a published JD with its current candidate-visible interview process.
      parameters:
        - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: JD and verified manual process when available., content: { application/json: { schema: { $ref: "#/components/schemas/JobDescriptionDetail" } } } }
        "404": { description: JD is unavailable. }
  /api/v1/jd-fit:
    get:
      tags: [catalogue]
      operationId: listJdFit
      summary: The signed-in user's fit score for each role card (same JDs and filters as GET /api/v1/jds).
      description: >
        JD fit (jd-fit-v1) is how closely the user's resume, GitHub and coding profiles match one JD's listing:
        skills, domain, role, experience and round topics. Rules only, computed on request, never stored. It is a
        separate contract from the profile score and never affects interview results, gating, readiness or leaderboards.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: company, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/EngineeringLevel" } }
        - { name: specialization, in: query, schema: { type: string } }
      responses:
        "200": { description: One score per listed JD., content: { application/json: { schema: { $ref: "#/components/schemas/JdFitList" } } } }
        "400": { description: Invalid level. }
  /api/v1/jd-fit/{jdId}:
    get:
      tags: [catalogue]
      operationId: getJdFit
      summary: Why the signed-in user's fit score for one JD is what it is, part by part.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jdId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Score breakdown., content: { application/json: { schema: { $ref: "#/components/schemas/JdFitBreakdown" } } } }
        "404": { description: JD is unavailable. }
  /api/v1/interviews/sessions/{sessionId}/reschedule:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: rescheduleInterviewSession
      tags: [interview-sessions]
      summary: Move a not-yet-started interview to another slot (409 session_slot_taken if you already have one then).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RescheduleInterviewSessionRequest" } } }
      responses:
        "403": { description: "`interview_access_required` — the account has the USER role and cannot run interviews.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "200": { description: Rescheduled., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewSession" } } } }
        "409": { description: Slot taken or session can no longer be moved. }
  /api/v1/interviews/sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: cancelInterviewSession
      tags: [interview-sessions]
      summary: Cancel a not-yet-started interview.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/InterviewSession" } } } }
        "409": { description: Session can no longer be cancelled. }
  /api/v1/loops:
    get:
      operationId: listLoops
      tags: [loops]
      summary: The candidate's loops with per-round state and progress.
