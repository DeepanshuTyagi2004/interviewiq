spring.application.name=interviewiq-backend
spring.config.import=optional:file:.env[.properties]

spring.mvc.apiversion.use.path-segment=1

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, profile, email

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.refresh-token.days=14

# --- GitHub Profile Builder ---
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
github.oauth.scope=read:user
github.oauth.authorize-url=https://github.com/login/oauth/authorize
github.oauth.token-url=https://github.com/login/oauth/access_token
github.oauth.callback-url=http://localhost:8080/api/v1/connections/github/callback
github.api.graphql-url=https://api.github.com/graphql
github.token-key=${GITHUB_TOKEN_KEY}

# --- LeetCode Profile Builder ---
# Public GraphQL endpoint LeetCode's own frontend uses. No auth/token required.
leetcode.api.graphql-url=${LEETCODE_GRAPHQL_URL:https://leetcode.com/graphql}
app.connections-redirect=${FRONTEND_CONNECTIONS_REDIRECT:${app.frontend-url}/connections}

# profile_fragment.data is a jsonb column mapped as a Java String. Tell the PG
# driver to send String params as 'unspecified' so Postgres casts them to jsonb
# (otherwise: "column data is of type jsonb but expression is of type character varying").
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# --- Résumé upload (onboarding) ---
# Backstop above the controller's authoritative 6 MB check, so an oversized upload is rejected with
# a clean "too large" ApiError rather than being read into memory first.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# --- interviewiq-ai-service (interview intelligence) ---
# Home of all LLM logic. This backend never calls an LLM directly; it fetches
# pre-generated interview briefs from the AI service over HTTP.
aiservice.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}

# --- Internal service-to-service shared secret ---
# Same key on both sides: this backend presents it to the AI service, and the AI
# service presents it to this backend's /api/v1/internal/** endpoints.
internal.api-key=${INTERNAL_API_KEY}

# --- Admin bootstrap ---
# Comma-separated emails auto-promoted to ADMIN on Google login. This is how the
# first admin(s) are created; after that, admins promote others via the API.
app.admin-emails=${ADMIN_EMAILS:}

# --- Interview prep (Pipeline 1) trigger ---
# A plain Spring @Scheduled poller (InterviewPrepScheduler) — the repo's existing scheduling
# mechanism, no new queue dependency. It builds prep for SCHEDULED sessions whose slot is within
# the lead time, then moves them PREP_READY/PREP_FAILED. All three knobs are configurable.
interviewprep.lead-time-minutes=${INTERVIEW_PREP_LEAD_TIME_MINUTES:15}
interviewprep.poll-interval-ms=${INTERVIEW_PREP_POLL_INTERVAL_MS:60000}
interviewprep.poll-initial-delay-ms=${INTERVIEW_PREP_POLL_INITIAL_DELAY_MS:30000}
# Plan generation is fire-and-poll (ai-service /interview-plans/start → poll runs/{id}): the trigger
# starts a run, then polls this often until PREP_READY/PREP_FAILED, giving up after the max wait.
# Every HTTP call stays short so a slow concurrent LLM run can't trip the client read timeout.
interviewprep.plan-poll-interval-ms=${INTERVIEW_PREP_PLAN_POLL_INTERVAL_MS:2000}
interviewprep.plan-max-wait-ms=${INTERVIEW_PREP_PLAN_MAX_WAIT_MS:180000}

# --- LiveKit (Pipeline 2 live interview) ---
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
